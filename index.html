<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREPS - Home</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .home-hero { width: 100%; height: 70vh; background: url('img/hero.jpg') center/cover no-repeat; margin-bottom: 40px; }
        .product-slider { display: flex; overflow-x: auto; gap: 20px; padding: 40px 20px; scroll-snap-type: x mandatory; }
        .product-slider::-webkit-scrollbar { display: none; }
        .slide-card { min-width: 300px; border: 2px solid #000; text-align: center; scroll-snap-align: center; text-decoration: none; color: #000; }
        .slide-card img { width: 100%; height: 300px; object-fit: cover; border-bottom: 2px solid #000; }
        .slide-info { padding: 20px; }
        .price { font-size: 24px; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <div class="hero-slogan">DISEÑADO PARA TU RENDIMIENTO</div>
        <nav>
            <a href="index.html" class="active">Hogar</a>
            <a href="catalogo.html">Catalogar</a>
            <a href="nosotros.html">Sobre nosotros</a>
        </nav>
    </header>

    <div class="home-hero"></div>

    <section class="product-slider">
        <a href="catalogo.html" class="slide-card">
            <img src="img/menu1.jpg">
            <div class="slide-info"><h3>POWER BREAST HIGH CARB</h3><div class="price">$7.000 CLP</div></div>
        </a>
        <a href="catalogo.html" class="slide-card">
            <img src="img/menu2.jpg">
            <div class="slide-info"><h3>POWER BREAST LOW CARB</h3><div class="price">$6.500 CLP</div></div>
        </a>
        <a href="catalogo.html" class="slide-card">
            <img src="img/pack5.jpg">
            <div class="slide-info"><h3>PACK 5 COMIDAS</h3><div class="price">$30.000 CLP</div></div>
        </a>
    </section>

    <footer>© 2026 PREPS - TODOS LOS DERECHOS RESERVADOS</footer>
</body>
</html>
