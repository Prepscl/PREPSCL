<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PREPS - DISEÑADO PARA TU RENDIMIENTO</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f2f2f2; 
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 0;
            text-transform: uppercase;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. LOADER MÍSTICO */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 1s ease;
        }
        #loader img { width: 150px; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1); opacity: 1; }
        }

        /* HEADER */
        header { 
            width: 100%; 
            text-align: center; 
            padding: 60px 0 40px; 
            background: #f2f2f2; 
        }
        .logo-link img { width: 180px; margin-bottom: 30px; }

        nav { display: flex; justify-content: center; align-items: center; margin-bottom: 40px; }
        nav a {
            text-decoration: none; color: #000;
            font-size: 13px; letter-spacing: 2px; margin: 0 20px;
            padding-bottom: 5px; border-bottom: 2px solid transparent; transition: 0.3s;
        }
        nav a.active { border-bottom: 2px solid #000; font-weight: bold; }

        /* BOLSA DE COMPRA */
        .cart-link-container { position: relative; display: inline-flex; align-items: center; border-bottom: none !important; }
        .cart-icon-svg { width: 22px; height: 22px; color: #000; }
        #global-cart-count {
            position: absolute; top: -8px; right: -10px;
            background: #000; color: #fff;
            font-family: 'Inter'; font-weight: 900; font-size: 10px;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- NUEVA SECCIÓN: LAB HERO (IMAGEN GIGANTE) --- */
        .lab-hero {
            width: 100%;
            height: 100vh;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* LA FOTO QUE ME MANDASTE */
        .lab-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8; /* Toque cinematográfico */
            transform: scale(1.1); /* Para el efecto de zoom al scroll */
        }

        .lab-overlay {
            position: absolute;
            z-index: 10;
            text-align: center;
            color: #fff;
        }

        .lab-title {
            font-family: 'Inter';
            font-weight: 900;
            font-size: 5vw;
            letter-spacing: -2px;
            margin: 0;
            line-height: 0.9;
        }

        .lab-tag {
            font-size: 12px;
            letter-spacing: 10px;
            color: #aaa;
            margin-top: 20px;
            display: block;
        }

        /* SLIDER DE PRODUCTOS */
        .section-header h2 { font-family: 'Inter'; text-align: center; font-size: 32px; font-weight: 900; letter-spacing: -1.5px; margin: 80px 0 40px; }
        .slider-container { max-width: 1300px; margin: auto; padding-bottom: 100px; }
        .product-slider { display: flex; overflow-x: auto; gap: 30px; padding: 20px; scrollbar-width: none; }
        .product-slider::-webkit-scrollbar { display: none; }

        .slide-card { 
            min-width: 320px; border: 1px solid #ddd; background: #fff;
            text-align: center; text-decoration: none; color: #000; transition: 0.4s;
        }
        .slide-card:hover { transform: translateY(-10px); border-color: #000; }
        .slide-card img { width: 100%; height: 350px; object-fit: cover; }
        .slide-info { padding: 25px; border-top: 1px solid #eee; }
        .slide-info h3 { font-family: 'Inter'; font-size: 16px; font-weight: 900; margin: 0; }
        .price { font-weight: bold; margin-top: 10px; }

        .card-custom-highlight { background: #000 !important; }
        .card-custom-highlight .slide-info h3, .card-custom-highlight .price { color: #fff; }

        .slider-nav { display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 40px; }
        .nav-arrow { background: #fff; border: 1px solid #000; width: 50px; height: 50px; cursor: pointer; border-radius: 50%; }
        .nav-arrow:hover { background: #000; color: #fff; }

        footer { background: #000; color: #fff; padding: 60px; text-align: center; font-size: 10px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="loader">
        <img src="img/logo-preps.png" alt="PREPS">
        <p style="font-size: 10px; letter-spacing: 8px; margin-top: 30px; color: #333;">INICIALIZANDO LABORATORIO...</p>
    </div>

    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav>
            <a href="index.html" class="active">HOME</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
            <a href="carrito.html" class="cart-link-container">
                <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span id="global-cart-count">0</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="lab-hero">
            <div class="lab-overlay">
                <h1 class="lab-title">ENGINEERED<br>PERFORMANCE</h1>
                <span class="lab-tag">PROTOCOLO V1.0</span>
            </div>
            <img src="img/home.jpg" class="lab-img" id="heroImg">
        </section>

        <section class="slider-container">
            <div class="section-header"><h2>FUEL CATALOG</h2></div>
            <div class="product-slider" id="productSlider">
                <a href="producto.html?id=highcarb" class="slide-card">
                    <img src="img/menu1.png">
                    <div class="slide-info"><h3>POWER BREAST HIGH CARB</h3><div class="price">$5.690</div></div>
                </a>
                <a href="producto.html?id=lowcarb" class="slide-card">
                    <img src="img/menu2.png">
                    <div class="slide-info"><h3>POWER BREAST LOW CARB</h3><div class="price">$4.900</div></div>
                </a>
                <a href="personalizar.html" class="slide-card card-custom-highlight">
                    <img src="img/2.png">
                    <div class="slide-info"><h3>CUSTOM LAB PERFORMANCE</h3><div class="price">DESDE $4.000</div></div>
                </a>
            </div>

            <div class="slider-nav">
                <button class="nav-arrow" onclick="scrollSlider(-1)">&#10094;</button>
                <div class="counter"><span id="current-index">1</span><span style="color: #ccc;"> / 3</span></div>
                <button class="nav-arrow" onclick="scrollSlider(1)">&#10095;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 PREPS CHILE - DISEÑADO PARA TU RENDIMIENTO</p>
    </footer>

    <script>
        // REGISTRAR PLUGIN DE SCROLL (EL SECRETO DE CORN REVOLUTION)
        gsap.registerPlugin(ScrollTrigger);

        window.addEventListener('load', () => {
            // OCULTAR LOADER
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => { 
                    document.getElementById('loader').style.display = 'none';
                    startAnimations(); // INICIAR MAGIA
                }, 800);
            }, 1500);
        });

        function startAnimations() {
            // ANIMACIÓN DE LA IMAGEN GIGANTE (ZOOM AL SCROLL)
            gsap.to("#heroImg", {
                scale: 1,
                ease: "none",
                scrollTrigger: {
                    trigger: ".lab-hero",
                    start: "top top",
                    end: "bottom top",
                    scrub: true
                }
            });

            // ANIMACIÓN DEL TEXTO BLANCO
            gsap.from(".lab-overlay", {
                y: 100,
                opacity: 0,
                duration: 1.5,
                ease: "power4.out"
            });
        }

        // LÓGICA DEL SLIDER (MANTENIDA)
        const slider = document.getElementById('productSlider');
        function scrollSlider(direction) {
            const cardWidth = slider.querySelector('.slide-card').offsetWidth + 30;
            slider.scrollBy({ left: direction * cardWidth, behavior: 'smooth' });
        }
        
        function updateGlobalCartCount() {
            const cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            document.getElementById('global-cart-count').innerText = cart.length;
        }
        updateGlobalCartCount();
    </script>
</body>
</html>
