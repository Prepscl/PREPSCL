<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREPS - Home</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link rel="apple-touch-icon" href="img/logo-preps.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* FONDO Y TIPOGRAFÍA BASE */
        body {
            background-color: #f2f2f2; 
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
            width: 100%;
        }

        /* HEADER HOME - CENTRADO ABSOLUTO */
        header {
            width: 100%;
            display: block; 
            text-align: center;
            padding: 80px 0 40px; 
            background: #f2f2f2;
        }

        .logo-link {
            display: inline-block;
            margin-bottom: 40px;
        }

        .logo-link img {
            width: 200px; 
            height: auto;
            display: block;
        }

        /* NAVEGACIÓN - CENTRADO CON INLINE-BLOCK */
        nav {
            display: block;
            width: 100%;
            margin-bottom: 50px;
            text-align: center;
        }

        nav a {
            display: inline-block; 
            text-decoration: none;
            color: #000;
            font-size: 16px;
            letter-spacing: 2px;
            padding-bottom: 8px;
            margin: 0 20px; 
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        nav a.active {
            border-bottom: 2px solid #000; 
        }

        /* ESLOGAN EN NEGRITA Y CENTRADO */
        .hero-slogan {
            display: block;
            width: 100%;
            font-size: 18px;
            letter-spacing: 5px; 
            color: #000;
            font-weight: 900; 
            text-align: center;
            margin: 0 auto;
        }

        /* CONTENIDO */
        .home-hero { 
            width: 100%; 
            height: 75vh; 
            background: url('img/hero.jpg') center/cover no-repeat; 
            margin-top: 60px;
            margin-bottom: 80px;
        }

        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h2 { font-size: 28px; letter-spacing: 4px; }

        .slider-container {
            position: relative;
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 100px;
        }

        .product-slider { 
            display: flex; 
            overflow-x: auto; 
            gap: 20px; 
            padding-bottom: 30px; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        
        .product-slider::-webkit-scrollbar { display: none; }

        .slide-card { 
            min-width: 320px; 
            border: 2px solid #000; 
            text-align: center; 
            scroll-snap-align: center; 
            text-decoration: none; 
            color: #000;
            background: #fff;
            transition: 0.3s ease;
        }

        .slide-card:hover { transform: translateY(-5px); }
        .slide-card img { width: 100%; height: 350px; object-fit: cover; border-bottom: 2px solid #000; }
        .slide-info { padding: 25px; }
        .slide-info h3 { font-size: 18px; letter-spacing: 1px; }
        .price { font-size: 20px; font-weight: bold; margin-top: 10px; }

        .slider-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            font-size: 20px;
        }

        .nav-arrow {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #ccc;
            transition: 0.3s;
        }

        .nav-arrow:hover { color: #000; }
        #current-index { color: #000; font-weight: bold; }
        .total-index { color: #888; }

        /* FOOTER CON INSTAGRAM */
        footer {
            background: #000;
            color: #fff;
            padding: 60px 20px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .social-link img {
            width: 30px;
            height: auto;
            filter: invert(1); /* Convierte el icono negro en blanco */
            transition: opacity 0.3s;
            margin-bottom: 20px;
        }

        .social-link img:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <img src="img/logo-preps.png" alt="PREPS">
        </a>
        <nav>
            <a href="index.html" class="active">Hogar</a>
            <a href="catalogo.html">Catalogar</a>
            <a href="nosotros.html">Sobre nosotros</a>
        </nav>
        <div class="hero-slogan">DISEÑADO PARA TU RENDIMIENTO</div>
    </header>

    <main>
        <div class="home-hero"></div>

        <section class="slider-container">
            <div class="section-header">
                <h2>PRODUCTOS</h2>
            </div>

            <div class="product-slider" id="productSlider">
                <a href="producto.html?id=highcarb" class="slide-card">
                    <img src="img/menu1.jpg">
                    <div class="slide-info"><h3>POWER BREAST HIGH CARB</h3><div class="price">$7.000 CLP</div></div>
                </a>
                <a href="producto.html?id=lowcarb" class="slide-card">
                    <img src="img/menu2.jpg">
                    <div class="slide-info"><h3>POWER BREAST LOW CARB</h3><div class="price">$6.500 CLP</div></div>
                </a>
                <a href="producto.html?id=pack5" class="slide-card">
                    <img src="img/pack5.jpg">
                    <div class="slide-info"><h3>PACK 5 COMIDAS</h3><div class="price">$30.000 CLP</div></div>
                </a>
                <a href="producto.html?id=pack10" class="slide-card">
                    <img src="img/pack10.jpg">
                    <div class="slide-info"><h3>PACK 10 COMIDAS</h3><div class="price">$60.000 CLP</div></div>
                </a>
                <a href="producto.html?id=pack30" class="slide-card">
                    <img src="img/pack30.jpg">
                    <div class="slide-info"><h3>PACK 30 COMIDAS</h3><div class="price">$180.000 CLP</div></div>
                </a>
            </div>

            <div class="slider-nav">
                <button class="nav-arrow" onclick="scrollSlider(-1)">&#10094;</button>
                <div>
                    <span id="current-index">1</span>
                    <span class="total-index"> / 5</span>
                </div>
                <button class="nav-arrow" onclick="scrollSlider(1)">&#10095;</button>
            </div>
        </section>
    </main>

    <footer>
        <a href="https://www.instagram.com/prepscl/" target="_blank" class="social-link">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
        </a>
        <br>
        © 2026 PREPS - TODOS LOS DERECHOS RESERVADOS
    </footer>

    <script>
        const slider = document.getElementById('productSlider');
        const currentIndexEl = document.getElementById('current-index');
        const totalSlides = 5;

        slider.addEventListener('scroll', () => {
            const scrollLeft = slider.scrollLeft;
            const cardWidth = slider.querySelector('.slide-card').offsetWidth + 20;
            const activeIndex = Math.round(scrollLeft / cardWidth) + 1;
            
            if (activeIndex >= 1 && activeIndex <= totalSlides) {
                currentIndexEl.innerText = activeIndex;
            }
        });

        function scrollSlider(direction) {
            const cardWidth = slider.querySelector('.slide-card').offsetWidth + 20;
            slider.scrollBy({
                left: direction * cardWidth,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
