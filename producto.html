<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>Producto - PREPS</title>
    
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link rel="apple-touch-icon" href="img/logo-preps.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f2f2f2; font-family: 'Courier New', Courier, monospace; margin: 0; text-transform: uppercase; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1.2s cubic-bezier(0.17, 0.55, 0.55, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        nav { display: flex; align-items: center; gap: 30px; }
        nav a { text-decoration: none; color: #000; font-size: 14px; letter-spacing: 1px; }

        .cart-link-container { position: relative; display: inline-flex; align-items: center; text-decoration: none; }
        .cart-icon-svg { width: 22px; height: 22px; color: #000; }
        #global-cart-count { position: absolute; top: -8px; right: -10px; background: #000; color: #fff; font-family: 'Inter'; font-weight: 900; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .product-page { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; max-width: 900px; margin: auto; }
        .image-container { position: relative; width: 100%; max-width: 500px; height: 500px; border: 1px solid #000; background: #fff; overflow: hidden; margin-bottom: 40px; }
        .image-wrapper { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .image-wrapper img { min-width: 100%; height: 100%; object-fit: cover; }
        .img-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 15px; box-sizing: border-box; pointer-events: none; }
        .img-nav button { pointer-events: auto; background: #fff; border: 1px solid #000; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; }

        .product-title { font-family: 'Inter'; font-weight: 900; font-size: 36px; margin: 20px 0; line-height: 0.9; }
        .price-large { font-family: 'Courier New'; font-size: 32px; margin-bottom: 20px; font-weight: 900; }
        
        .technical-desc { font-size: 13px; color: #444; margin-bottom: 30px; line-height: 1.5; max-width: 600px; }
        
        /* SELECTORES MINIMALISTAS */
        .config-box { width: 100%; max-width: 400px; margin-bottom: 40px; border: 1px solid #000; background: #fff; padding: 20px; box-sizing: border-box; text-align: left; }
        .config-label { font-family: 'Inter'; font-weight: 900; font-size: 11px; margin-bottom: 15px; display: block; letter-spacing: 1px; color: #888; }
        
        .pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .qty-input-small { width: 100%; padding: 10px; border: 1px solid #eee; font-family: 'Inter'; font-weight: 900; text-align: center; box-sizing: border-box; }

        .option-toggle { display: flex; gap: 10px; }
        .btn-opt { flex: 1; padding: 12px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: 'Inter'; font-weight: 900; font-size: 10px; transition: 0.3s; }
        .btn-opt.active { background: #000; color: #fff; }

        .purchase-container { display: flex; width: 100%; max-width: 400px; margin: 0 auto 60px; border: 1px solid #000; }
        .qty-main { width: 80px; border: none; border-right: 1px solid #000; font-family: 'Inter'; font-weight: 900; font-size: 18px; text-align: center; }
        .buy-btn-new { flex-grow: 1; background: #000; color: #fff; border: none; font-family: 'Inter'; font-weight: 900; font-size: 16px; cursor: pointer; }

        .macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #000; border: 1px solid #000; width: 100%; margin: 40px 0; }
        .macro-item { background: #fff; padding: 20px 5px; }
        .macro-num { display: block; font-size: 20px; font-weight: 900; font-family: 'Inter'; }
        .macro-label { font-size: 9px; color: #888; font-weight: 900; }

        /* MODAL */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 500px; padding: 40px; position: relative; text-align: center; }
        .btn-modal-black { background: #000; color: #fff; padding: 18px; text-decoration: none; font-weight: 900; display: block; margin-bottom: 10px; }

        @media (max-width: 600px) { header { padding: 15px 20px; flex-direction: column; gap: 15px; } .macro-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav>
            <a href="index.html">HOGAR</a>
            <a href="catalogo.html">CATALOGAR</a>
            <a href="nosotros.html">NOSOTROS</a>
            <a href="carrito.html" class="cart-link-container">
                <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span id="global-cart-count">0</span>
            </a>
        </nav>
    </header>

    <main class="product-page" id="product-content"></main>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="font-family:'Inter'; font-weight:900;">AGREGADO</h2>
            <p id="modal-name" style="font-size:12px; margin-bottom:20px;"></p>
            <a href="carrito.html" class="btn-modal-black">VER CARRO</a>
            <button onclick="closeModal()" style="background:none; border:2px solid #000; padding:15px; width:100%; font-weight:900; cursor:pointer;">SEGUIR</button>
        </div>
    </div>

    <footer>© 2026 PREPS - PRECISION DINING</footer>

    <script>
        const db = {
            highcarb: { id: 'highcarb', name: "POWER BREAST HIGH CARB", price: "$5.690", imgs: ["img/menu1.jpg"], k: "830", p: "73", c: "92", g: "19", grams: "200G POLLO | 300G ARROZ | 100G BRÓCOLI" },
            lowcarb: { id: 'lowcarb', name: "POWER BREAST LOW CARB", price: "$4.990", imgs: ["img/menu2.jpg"], k: "632", p: "69", c: "49", g: "17", grams: "200G POLLO | 150G ARROZ | 100G BRÓCOLI" },
            pack5: { id: 'pack5', name: "05 PACKS PERFORMANCE", price: "$24.900", imgs: ["img/pack5.jpg"], k: "VAR", p: "VAR", c: "VAR", g: "VAR", total: 5 },
            pack15: { id: 'pack15', name: "15 PACKS PERFORMANCE", price: "$72.900", imgs: ["img/pack15.jpg"], k: "VAR", p: "VAR", c: "VAR", g: "VAR", total: 15 },
            pack28: { id: 'pack28', name: "28 PACKS PERFORMANCE", price: "$129.900", imgs: ["img/pack28.jpg"], k: "VAR", p: "VAR", c: "VAR", g: "VAR", total: 28 }
        };

        const params = new URLSearchParams(window.location.search);
        const item = db[params.get('id')] || db.highcarb;
        let conPimienta = true;

        function setPimienta(val) {
            conPimienta = val;
            document.getElementById('btn-p-si').classList.toggle('active', val);
            document.getElementById('btn-p-no').classList.toggle('active', !val);
        }

        function renderProduct() {
            const isPack = item.id.includes('pack');
            
            let configHTML = `
                <div class="config-box">
                    <span class="config-label">SAZÓN: PIMIENTA NEGRA</span>
                    <div class="option-toggle">
                        <button id="btn-p-si" class="btn-opt active" onclick="setPimienta(true)">CON PIMIENTA</button>
                        <button id="btn-p-no" class="btn-opt" onclick="setPimienta(false)">SIN PIMIENTA</button>
                    </div>
                </div>
            `;

            if (isPack) {
                configHTML = `
                    <div class="config-box">
                        <span class="config-label">DISTRIBUCIÓN DEL PACK (${item.total} UNIDADES)</span>
                        <div class="pack-grid">
                            <div>
                                <label style="font-size:9px; font-weight:900;">HIGH CARB</label>
                                <input type="number" id="qty-hc" class="qty-input-small" value="${item.total}" min="0" max="${item.total}" onchange="adjustPack(this, 'qty-lc')">
                            </div>
                            <div>
                                <label style="font-size:9px; font-weight:900;">LOW CARB</label>
                                <input type="number" id="qty-lc" class="qty-input-small" value="0" min="0" max="${item.total}" onchange="adjustPack(this, 'qty-hc')">
                            </div>
                        </div>
                        <span class="config-label">SAZÓN GENERAL</span>
                        <div class="option-toggle">
                            <button id="btn-p-si" class="btn-opt active" onclick="setPimienta(true)">CON PIMIENTA</button>
                            <button id="btn-p-no" class="btn-opt" onclick="setPimienta(false)">SIN PIMIENTA</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('product-content').innerHTML = `
                <div class="image-container reveal active">
                    <div class="image-wrapper" id="wrapper">${item.imgs.map(img => `<img src="${img}">`).join('')}</div>
                </div>
                <div class="price-large">${item.price}</div>
                <h1 class="product-title">${item.name}</h1>
                <p style="font-family:'Inter'; font-weight:900; font-size:12px; letter-spacing:1px; margin-bottom:10px;">${item.grams || 'PACK MULTI-OBJETIVO'}</p>
                <p class="technical-desc">POLLO A LA PLANCHA SELLADO CON ARROZ BLANCO Y BRÓCOLI COCIDO AL DENTE PARA PRESERVAR AL MÁXIMO SUS MACRONUTRIENTES Y TEXTURA.</p>
                
                ${configHTML}

                <div class="purchase-container">
                    <input type="number" id="qty-main" class="qty-main" value="1" min="1" max="10">
                    <button class="buy-btn-new" onclick="addToCart()">AÑADIR AL SISTEMA</button>
                </div>

                <div class="macro-grid">
                    <div class="macro-item"><span class="macro-num">${item.k}</span><span class="macro-label">KCAL</span></div>
                    <div class="macro-item"><span class="macro-num">${item.p}G</span><span class="macro-label">PROT</span></div>
                    <div class="macro-item"><span class="macro-num">${item.c}G</span><span class="macro-label">CARBS</span></div>
                    <div class="macro-item"><span class="macro-num">${item.g}G</span><span class="macro-label">FAT</span></div>
                </div>
            `;
        }

        function adjustPack(input, otherId) {
            let val = parseInt(input.value) || 0;
            if (val > item.total) val = item.total;
            if (val < 0) val = 0;
            input.value = val;
            document.getElementById(otherId).value = item.total - val;
        }

        function addToCart() {
            const qty = parseInt(document.getElementById('qty-main').value);
            const priceVal = parseInt(item.price.replace('$', '').replace('.', ''));
            const pimientaText = conPimienta ? "C/PIMIENTA" : "S/PIMIENTA";
            
            let finalName = `${item.name} (${pimientaText})`;
            if (item.id.includes('pack')) {
                const hc = document.getElementById('qty-hc').value;
                const lc = document.getElementById('qty-lc').value;
                finalName = `${item.name} [${hc}HC|${lc}LC] (${pimientaText})`;
            }

            let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            for(let i=0; i<qty; i++) { cart.push({ name: finalName, price: priceVal }); }
            localStorage.setItem('preps_cart', JSON.stringify(cart));
            
            updateGlobalCartCount();
            document.getElementById('modal-name').innerText = finalName + " x" + qty;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function updateGlobalCartCount() {
            const cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            document.getElementById('global-cart-count').innerText = cart.length;
        }

        window.addEventListener('load', () => { updateGlobalCartCount(); renderProduct(); });
    </script>
</body>
</html>
