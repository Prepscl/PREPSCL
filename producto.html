<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - PREPS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #f2f2f2; font-family: 'Courier New', Courier, monospace; margin: 0; text-transform: uppercase; }
        
        /* HEADER ESTILO REFRESKO */
        header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        nav { display: flex; gap: 30px; }
        nav a { text-decoration: none; color: #000; font-size: 14px; letter-spacing: 1px; }

        /* DISEÑO DE PÁGINA CENTRADA */
        .product-page { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; /* Centra todo el texto */
            padding: 60px 20px; 
            max-width: 800px; 
            margin: auto; 
        }
        
        /* CONTENEDOR DE IMAGEN */
        .image-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; /* Tamaño controlado para que no se vea gigante */
            height: 500px; 
            border: 2px solid #000; 
            background: #fff; 
            overflow: hidden; 
            margin-bottom: 40px;
        }
        
        .image-wrapper { display: flex; height: 100%; transition: transform 0.5s ease-in-out; }
        .image-wrapper img { min-width: 100%; height: 100%; object-fit: contain; background: #fff; }
        
        .img-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 10px; box-sizing: border-box; }
        .img-nav button { pointer-events: auto; background: #fff; border: 2px solid #000; cursor: pointer; padding: 10px 15px; font-size: 20px; transition: 0.3s; }
        .img-nav button:hover { background: #000; color: #fff; }

        /* DETALLES DEL PRODUCTO */
        .product-details { width: 100%; }
        .product-details h1 { font-size: 28px; margin-bottom: 20px; letter-spacing: 2px; font-weight: 900; }
        .price-large { font-size: 32px; margin-bottom: 30px; font-weight: 900; color: #000; }
        
        .buy-btn { 
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto 50px; 
            background: #000; 
            color: #fff; 
            padding: 20px; 
            text-align: center; 
            text-decoration: none; 
            display: block; 
            font-weight: 900; 
            font-size: 18px; 
            transition: 0.3s; 
        }
        .buy-btn:hover { background: #333; transform: translateY(-2px); }

        .info-block { 
            margin-bottom: 30px; 
            font-size: 16px; 
            text-transform: none; /* Permite lectura más cómoda */
            font-family: Arial, sans-serif; 
            line-height: 1.6;
        }

        /* SUBTÍTULOS EN NEGRITA */
        .info-block strong { 
            text-transform: uppercase; 
            font-family: 'Courier New', monospace; 
            display: block; 
            margin-bottom: 8px; 
            font-size: 15px;
            font-weight: 900; /* Negrita pura */
            letter-spacing: 1px;
        }
        
        footer { background: #000; color: #fff; padding: 60px; text-align: center; font-size: 12px; margin-top: 80px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav><a href="index.html">HOGAR</a><a href="catalogo.html">CATALOGAR</a><a href="nosotros.html">SOBRE NOSOTROS</a></nav>
    </header>

    <main class="product-page" id="product-content"></main>

    <footer>© 2026 PREPS - TODOS LOS DERECHOS RESERVADOS</footer>

    <script>
        const db = {
            highcarb: {
                name: "POWER BREAST HIGH CARB", price: "$7.000 CLP", 
                imgs: ["img/menu1.jpg", "img/tabla_highcarb.png"],
                desc: "Pechuga de pollo con arroz y brócoli. Diseñado para carga de glucógeno.",
                ing: "Pechuga de pollo (200g), Arroz (300g), Brócoli (100g).",
                vida: "5 a 7 días en refrigeración.",
                macros: "830 KCAL | PROT: 73G | CARBS: 92G | GRASAS: 19G",
                envio: "24 a 48 horas hábiles."
            },
            lowcarb: {
                name: "POWER BREAST LOW CARB", price: "$6.500 CLP", 
                imgs: ["img/menu2.jpg", "img/etiqueta_low_carb_450g_final.png"],
                desc: "Opción ligera con carbohidratos controlados.",
                ing: "Pechuga de pollo (200g), Arroz (150g), Brócoli (100g).",
                vida: "5 a 7 días en refrigeración.",
                macros: "632 KCAL | PROT: 69G | CARBS: 49G | GRASAS: 17G",
                envio: "24 a 48 horas hábiles."
            },
            pack5: {
                name: "PACK 5 COMIDAS", price: "$30.000 CLP", imgs: ["img/pack5.jpg"],
                desc: "Tu semana laboral resuelta.", ing: "Mix de menús PREPS.", vida: "7 días.", macros: "Variable.", envio: "Incluido."
            },
            pack10: {
                name: "PACK 10 COMIDAS", price: "$60.000 CLP", imgs: ["img/pack10.jpg"],
                desc: "10 platos para optimizar tiempo.", ing: "Mix libre.", vida: "7 días.", macros: "Variable.", envio: "Prioritario."
            },
            pack30: {
                name: "PACK 30 COMIDAS", price: "$180.000 CLP", imgs: ["img/pack30.jpg"],
                desc: "Mes completo de nutrición.", ing: "Acceso total.", vida: "Mensual.", macros: "Asesoría incluida.", envio: "Programado."
            }
        };

        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const p = db[productId] || db.highcarb;

        let imagesHtml = p.imgs.map(img => `<img src="${img}" onerror="this.src='img/logo-preps.png'">`).join('');
        let navHtml = p.imgs.length > 1 ? `
            <div class="img-nav">
                <button onclick="moveSlide(-1)">&#10094;</button>
                <button onclick="moveSlide(1)">&#10095;</button>
            </div>` : '';

        document.getElementById('product-content').innerHTML = `
            <div class="image-container">
                <div class="image-wrapper" id="wrapper">${imagesHtml}</div>
                ${navHtml}
            </div>
            <div class="product-details">
                <div class="price-large">${p.price}</div>
                <a href="https://wa.me/56941892028?text=Hola, quiero comprar: ${p.name}" class="buy-btn">Compre ya</a>
                <h1>${p.name}</h1>
                <div class="info-block"><strong>Descripción:</strong> ${p.desc}</div>
                <div class="info-block"><strong>Ingredientes:</strong> ${p.ing}</div>
                <div class="info-block"><strong>Macros:</strong> ${p.macros}</div>
                <div class="info-block"><strong>Vida útil:</strong> ${p.vida}</div>
                <div class="info-block"><strong>Envío:</strong> ${p.envio}</div>
            </div>
        `;

        let currentImg = 0;
        function moveSlide(step) {
            const wrapper = document.getElementById('wrapper');
            const total = p.imgs.length;
            currentImg = (currentImg + step + total) % total;
            wrapper.style.transform = `translateX(-${currentImg * 100}%)`;
        }
    </script>
</body>
</html>
