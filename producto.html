<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>Producto - PREPS</title>
    
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link rel="apple-touch-icon" href="img/logo-preps.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        body { 
            background-color: #f2f2f2; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            text-transform: uppercase; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .reveal { 
            opacity: 0; 
            transform: translateY(30px); 
            transition: all 1.2s cubic-bezier(0.17, 0.55, 0.55, 1); 
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; 
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-link img { height: 35px; width: auto; display: block; }
        nav { display: flex; gap: 30px; }
        nav a { text-decoration: none; color: #000; font-size: 14px; letter-spacing: 1px; }

        .product-page { 
            display: flex; flex-direction: column; align-items: center; 
            text-align: center; padding: 60px 20px; max-width: 900px; margin: auto; 
        }
        
        .image-container { 
            position: relative; width: 100%; max-width: 500px; height: 500px; 
            border: 1px solid #000; background: #fff; overflow: hidden; margin-bottom: 40px;
        }
        
        .image-wrapper { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .image-wrapper img { min-width: 100%; height: 100%; object-fit: cover; }
        
        .img-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 15px; }
        .img-nav button { pointer-events: auto; background: #fff; border: 1px solid #000; cursor: pointer; width: 45px; height: 45px; border-radius: 50%; }

        /* FOTO 1: SELECTOR Y BOTÓN */
        .purchase-container { display: flex; width: 100%; max-width: 400px; margin: 0 auto 60px; border: 1px solid #000; }
        .qty-input { 
            width: 80px; border: none; border-right: 1px solid #000; 
            font-family: 'Inter'; font-weight: 900; font-size: 18px; 
            text-align: center; padding: 15px; cursor: pointer; background: #fff;
        }
        .buy-btn-new { 
            flex-grow: 1; background: #000; color: #fff; border: none; 
            font-family: 'Inter'; font-weight: 900; font-size: 16px; 
            letter-spacing: 1px; cursor: pointer; transition: 0.3s; 
        }

        /* FOTO 2: MODAL */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 500px; padding: 40px; position: relative; text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: #888; }
        .modal-title { font-family: 'Inter'; font-weight: 900; font-size: 24px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .modal-product-info { display: flex; align-items: center; gap: 20px; text-align: left; margin-bottom: 30px; }
        .modal-product-info img { width: 90px; height: 90px; object-fit: cover; border: 1px solid #eee; }
        .modal-text h3 { font-family: 'Inter'; font-weight: 900; font-size: 14px; margin: 0; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-modal-black { background: #000; color: #fff; padding: 18px; text-decoration: none; font-weight: 900; font-size: 14px; display: block; }
        .btn-modal-outline { background: #fff; color: #000; padding: 18px; border: 2px solid #000; font-weight: 900; font-size: 14px; cursor: pointer; }

        .product-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 36px; margin: 20px 0; line-height: 0.9; }
        .price-large { font-family: 'Courier New', monospace; font-size: 32px; margin-bottom: 30px; font-weight: 900; }
        .macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #000; border: 1px solid #000; margin: 40px 0; }
        .macro-item { background: #fff; padding: 25px 10px; text-align: center; }
        .macro-num { display: block; font-size: 24px; font-weight: 900; font-family: 'Inter', sans-serif; }
        .macro-label { font-size: 10px; color: #888; font-weight: 900; }
        .specs-table { width: 100%; border-top: 1px solid #000; margin-top: 40px; text-align: left; }
        .spec-row { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #ddd; }
        .spec-label { font-weight: 900; font-size: 12px; color: #888; }
        .spec-value { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 15px; }

        footer { background: #000; color: #fff; padding: 60px; text-align: center; font-size: 10px; letter-spacing: 2px; }

        @media (max-width: 600px) {
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .macro-grid { grid-template-columns: repeat(2, 1fr); }
            .image-container { height: 350px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav><a href="index.html">HOGAR</a><a href="catalogo.html">CATALOGAR</a><a href="nosotros.html">NOSOTROS</a></nav>
    </header>

    <main class="product-page" id="product-content"></main>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="modal-title">AGREGADO AL CARRO</h2>
            <div class="modal-product-info">
                <img id="modal-img" src="" alt="">
                <div class="modal-text">
                    <h3 id="modal-name"></h3>
                    <p>CANTIDAD AGREGADA: <span id="modal-qty"></span></p>
                    <p style="font-weight: 900; color: #000; font-size: 14px; margin-top: 10px;">TOTAL: <span id="modal-total"></span></p>
                </div>
            </div>
            <div class="modal-actions">
                <a href="carrito.html" class="btn-modal-black">VER CARRO</a>
                <button class="btn-modal-outline" onclick="closeModal()">SEGUIR COMPRANDO</button>
            </div>
        </div>
    </div>

    <footer>© 2026 PREPS - PRECISION DINING</footer>

    <script>
        const db = {
            highcarb: { name: "POWER BREAST HIGH CARB", price: "$5.690", imgs: ["img/menu1.jpg", "img/tabla_highcarb.png"], desc: "DISEÑADO PARA CARGA DE GLUCÓGENO Y MÁXIMO RENDIMIENTO.", ing: "POLLO A LA PLANCHA (200G), ARROZ (300G), BRÓCOLI (100G).", vida: "5 A 7 DÍAS EN REFRIGERACIÓN", k: "830", p: "73", c: "92", g: "19", envio: "24-48 HORAS HÁBILES" },
            lowcarb: { name: "POWER BREAST LOW CARB", price: "$4.990", imgs: ["img/menu2.jpg", "img/etiqueta_low_carb_450g_final.png"], desc: "OPCIÓN LIGERA CON CARBOHIDRATOS CONTROLADOS PARA DEFINICIÓN.", ing: "POLLO A LA PLANCHA (200G), ARROZ (150G), BRÓCOLI (100G).", vida: "5 A 7 DÍAS EN REFRIGERACIÓN", k: "632", p: "69", c: "49", g: "17", envio: "24-48 HORAS HÁBILES" },
            pack5: { name: "05 PACKS PERFORMANCE", price: "$24.900", imgs: ["img/pack5.jpg"], desc: "TU SEMANA LABORAL BAJO CONTROL NUTRICIONAL.", ing: "MIX DE MENÚS PREPS (POLLO A LA PLANCHA).", vida: "7 DÍAS REFRIGERADO", k: "VAR", p: "VAR", c: "VAR", g: "VAR", envio: "INCLUIDO" },
            pack15: { name: "15 PACKS PERFORMANCE", price: "$72.900", imgs: ["img/pack15.jpg"], desc: "COMPROMISO TOTAL CON TU OBJETIVO FÍSICO.", ing: "MIX LIBRE DE MENÚS.", vida: "7 DÍAS REFRIGERADO", k: "VAR", p: "VAR", c: "VAR", g: "VAR", envio: "PRIORITARIO" },
            pack28: { name: "28 PACKS PERFORMANCE", price: "$129.900", imgs: ["img/pack28.jpg"], desc: "MES COMPLETO DE NUTRICIÓN DE ÉLITE.", ing: "ACCESO TOTAL AL CATÁLOGO.", vida: "MENSUAL (ENTREGA SEMANAL)", k: "VAR", p: "VAR", c: "VAR", g: "VAR", envio: "PROGRAMADO" }
        };

        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const item = db[productId] || db.highcarb;

        function renderProduct() {
            let maxQty = 5;
            if (productId === 'pack5' || productId === 'pack15') maxQty = 2;
            if (productId === 'pack28') maxQty = 1;

            let qtyOptions = "";
            for(let i=1; i<=maxQty; i++) qtyOptions += `<option value="${i}">${i}</option>`;

            document.getElementById('product-content').innerHTML = `
                <div class="image-container reveal active">
                    <div class="image-wrapper" id="wrapper">${item.imgs.map(img => `<img src="${img}">`).join('')}</div>
                    ${item.imgs.length > 1 ? '<div class="img-nav"><button onclick="moveSlide(-1)">&#10094;</button><button onclick="moveSlide(1)">&#10095;</button></div>' : ''}
                </div>
                <div class="product-details reveal active">
                    <div class="price-large">${item.price}</div>
                    <h1 class="product-title">${item.name}</h1>
                    <div class="purchase-container">
                        <select id="qty-selector" class="qty-input">${qtyOptions}</select>
                        <button class="buy-btn-new" onclick="addToCart()">AGREGAR AL CARRO</button>
                    </div>
                    <div class="macro-grid">
                        <div class="macro-item"><span class="macro-num">${item.k}</span><span class="macro-label">KCAL</span></div>
                        <div class="macro-item"><span class="macro-num">${item.p}G</span><span class="macro-label">PROT</span></div>
                        <div class="macro-item"><span class="macro-num">${item.c}G</span><span class="macro-label">CARBS</span></div>
                        <div class="macro-item"><span class="macro-num">${item.g}G</span><span class="macro-label">FAT</span></div>
                    </div>
                </div>
            `;
        }

        function addToCart() {
            const qty = parseInt(document.getElementById('qty-selector').value);
            const priceVal = parseInt(item.price.replace('$', '').replace('.', ''));
            let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            for(let i=0; i<qty; i++) { cart.push({ name: item.name, price: priceVal }); }
            localStorage.setItem('preps_cart', JSON.stringify(cart));
            document.getElementById('modal-img').src = item.imgs[0];
            document.getElementById('modal-name').innerText = item.name;
            document.getElementById('modal-qty').innerText = qty;
            document.getElementById('modal-total').innerText = "$" + (priceVal * qty).toLocaleString('es-CL');
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        
        let currentImg = 0;
        function moveSlide(step) {
            const wrapper = document.getElementById('wrapper');
            currentImg = (currentImg + step + item.imgs.length) % item.imgs.length;
            wrapper.style.transform = `translateX(-${currentImg * 100}%)`;
        }

        renderProduct();
    </script>
</body>
</html>
