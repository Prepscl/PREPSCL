<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>Producto - PREPS</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f2f2f2; font-family: 'Courier New', Courier, monospace; margin: 0; text-transform: uppercase; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        nav { display: flex; align-items: center; gap: 30px; }
        nav a { text-decoration: none; color: #000; font-size: 14px; letter-spacing: 1px; }

        .cart-link-container { position: relative; display: inline-flex; align-items: center; text-decoration: none; }
        .cart-icon-svg { width: 22px; height: 22px; color: #000; }
        #global-cart-count { position: absolute; top: -8px; right: -10px; background: #000; color: #fff; font-family: 'Inter'; font-weight: 900; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .product-page { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; max-width: 900px; margin: auto; }
        .image-container { position: relative; width: 100%; max-width: 500px; height: 500px; border: 1px solid #000; background: #fff; overflow: hidden; margin-bottom: 40px; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .product-title { font-family: 'Inter'; font-weight: 900; font-size: 36px; margin: 20px 0; line-height: 0.9; }
        #live-price { font-family: 'Courier New'; font-size: 32px; margin-bottom: 20px; font-weight: 900; }
        .technical-desc { font-size: 13px; color: #444; margin-bottom: 30px; line-height: 1.5; max-width: 600px; }
        
        .config-box { width: 100%; max-width: 450px; margin-bottom: 40px; border: 1px solid #000; background: #fff; padding: 25px; box-sizing: border-box; text-align: left; }
        .config-label { font-family: 'Inter'; font-weight: 900; font-size: 11px; margin-bottom: 15px; display: block; letter-spacing: 1px; color: #888; }
        
        .pack-grid { display: flex; gap: 15px; margin-bottom: 25px; }
        .pack-item { flex: 1; }
        .pack-item label { display: block; font-size: 9px; font-weight: 900; margin-bottom: 8px; font-family: 'Inter'; height: 25px; }

        /* STEPPER SYSTEM */
        .stepper { display: flex; align-items: center; border: 2px solid #000; background: #fff; width: fit-content; }
        .stepper-btn { background: none; border: none; color: #000; font-family: 'Inter'; font-weight: 900; font-size: 20px; padding: 5px 15px; cursor: pointer; }
        .stepper-val { width: 40px; text-align: center; font-family: 'Inter'; font-weight: 900; font-size: 16px; border-left: 1px solid #eee; border-right: 1px solid #eee; }

        .option-toggle { display: flex; gap: 10px; }
        .btn-opt { flex: 1; padding: 12px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: 'Inter'; font-weight: 900; font-size: 10px; }
        .btn-opt.active { background: #000; color: #fff; }

        .purchase-container { display: flex; width: 100%; max-width: 400px; margin: 0 auto 60px; border: 1px solid #000; align-items: stretch; }
        .buy-btn-new { flex-grow: 1; background: #000; color: #fff; border: none; font-family: 'Inter'; font-weight: 900; font-size: 16px; cursor: pointer; padding: 15px; }

        .macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #000; border: 1px solid #000; width: 100%; margin: 40px 0; }
        .macro-item { background: #fff; padding: 20px 5px; }
        .macro-num { display: block; font-size: 20px; font-weight: 900; font-family: 'Inter'; }
        .macro-label { font-size: 9px; color: #888; font-weight: 900; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 500px; padding: 40px; position: relative; }
        .modal-title { font-family: 'Inter'; font-weight: 900; font-size: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; text-align: center; }
        
        .modal-body { display: flex; align-items: flex-start; gap: 20px; text-align: left; margin-bottom: 30px; position: relative; }
        #modal-img { width: 90px; height: 90px; object-fit: cover; border: 1px solid #eee; }
        .modal-info-text { flex-grow: 1; font-family: 'Inter'; }
        
        .delete-btn-container { position: absolute; right: 0; top: 0; text-align: right; cursor: pointer; }
        .delete-x { font-size: 22px; color: #000; font-weight: 900; display: block; line-height: 1; }
        .delete-label { font-size: 8px; color: #ff0000; font-weight: 900; display: block; margin-top: 4px; opacity: 0; transition: 0.2s; }
        .delete-btn-container:hover .delete-label { opacity: 1; }

        .btn-modal-black { background: #000; color: #fff; padding: 18px; text-decoration: none; font-weight: 900; display: block; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .btn-modal-outline { background: #fff; color: #000; padding: 18px; border: 2px solid #000; font-weight: 900; width: 100%; cursor: pointer; font-size: 14px; }

        @media (max-width: 600px) { header { padding: 15px 20px; flex-direction: column; gap: 15px; } .macro-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav>
            <a href="index.html">HOME</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
            <a href="carrito.html" class="cart-link-container">
                <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span id="global-cart-count">0</span>
            </a>
        </nav>
    </header>

    <main class="product-page" id="product-content"></main>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">TUS PEDIDOS</h2>
            <div class="modal-body">
                <img id="modal-img" src="" alt="">
                <div class="modal-info-text">
                    <div class="delete-btn-container" onclick="undoAddToCart()">
                        <span class="delete-x">✕</span>
                        <span class="delete-label">ELIMINAR PEDIDO</span>
                    </div>
                    <h3 id="modal-prod-name" style="margin:0; font-size:14px; font-weight:900;"></h3>
                    <p id="modal-qty-text" style="margin:5px 0; font-size:12px;"></p>
                    <p id="modal-total-text" style="font-weight: 900; color: #000; margin-top: 10px; font-size:16px;"></p>
                </div>
            </div>
            <a href="carrito.html" class="btn-modal-black">VER CARRO</a>
            <button class="btn-modal-outline" onclick="closeModal()">SEGUIR COMPRANDO</button>
        </div>
    </div>

    <script>
        const db = {
            highcarb: { id: 'highcarb', name: "POWER BREAST HIGH CARB", price: 5690, imgs: ["img/menu1.jpg"], k: "830", p: "73", c: "92", g: "19", grams: "200G POLLO | 300G ARROZ | 100G BRÓCOLI", max: 20 },
            lowcarb: { id: 'lowcarb', name: "POWER BREAST LOW CARB", price: 4990, imgs: ["img/menu2.jpg"], k: "632", p: "69", c: "49", g: "17", grams: "200G POLLO | 150G ARROZ | 100G BRÓCOLI", max: 20 },
            pack5: { id: 'pack5', name: "05 PACKS PERFORMANCE", price: 24900, imgs: ["img/pack5.jpg"], total: 5, max: 2 },
            pack15: { id: 'pack15', name: "15 PACKS PERFORMANCE", price: 72900, imgs: ["img/pack15.jpg"], total: 15, max: 2 },
            pack28: { id: 'pack28', name: "28 PACKS PERFORMANCE", price: 129900, imgs: ["img/pack28.jpg"], total: 28, max: 1 }
        };

        const params = new URLSearchParams(window.location.search);
        const item = db[params.get('id')] || db.highcarb;
        let conPimienta = true, lastAddedCount = 0, mainQty = 1, packHC = item.total || 0, packLC = 0;

        function updateLivePrice() {
            document.getElementById('live-price').innerText = "$" + (item.price * mainQty).toLocaleString('es-CL');
        }

        function setPimienta(val) {
            conPimienta = val;
            document.getElementById('btn-p-si').classList.toggle('active', val);
            document.getElementById('btn-p-no').classList.toggle('active', !val);
        }

        function stepMain(v) { mainQty = Math.max(1, Math.min(item.max, mainQty + v)); document.getElementById('val-main').innerText = mainQty; updateLivePrice(); }
        function stepPack(type, v) {
            if(type === 'hc') { packHC = Math.max(0, Math.min(item.total, packHC + v)); packLC = item.total - packHC; }
            else { packLC = Math.max(0, Math.min(item.total, packLC + v)); packHC = item.total - packLC; }
            document.getElementById('val-hc').innerText = packHC;
            document.getElementById('val-lc').innerText = packLC;
        }

        function renderProduct() {
            const isPack = item.id.includes('pack');
            let configHTML = isPack ? `
                <div class="config-box">
                    <span class="config-label">REPARTO DEL PACK (${item.total} UNIDADES)</span>
                    <div class="pack-grid">
                        <div class="pack-item">
                            <label>HIGH CARB</label>
                            <div class="stepper"><button class="stepper-btn" onclick="stepPack('hc',-1)">-</button><span class="stepper-val" id="val-hc">${packHC}</span><button class="stepper-btn" onclick="stepPack('hc',1)">+</button></div>
                        </div>
                        <div class="pack-item">
                            <label>LOW CARB</label>
                            <div class="stepper"><button class="stepper-btn" onclick="stepPack('lc',-1)">-</button><span class="stepper-val" id="val-lc">${packLC}</span><button class="stepper-btn" onclick="stepPack('lc',1)">+</button></div>
                        </div>
                    </div>
                    <span class="config-label">SAZÓN GENERAL</span>
                    <div class="option-toggle">
                        <button id="btn-p-si" class="btn-opt active" onclick="setPimienta(true)">CON PIMIENTA</button>
                        <button id="btn-p-no" class="btn-opt" onclick="setPimienta(false)">SIN PIMIENTA</button>
                    </div>
                </div>` : `
                <div class="config-box">
                    <span class="config-label">SAZÓN: PIMIENTA NEGRA</span>
                    <div class="option-toggle">
                        <button id="btn-p-si" class="btn-opt active" onclick="setPimienta(true)">CON PIMIENTA</button>
                        <button id="btn-p-no" class="btn-opt" onclick="setPimienta(false)">SIN PIMIENTA</button>
                    </div>
                </div>`;

            document.getElementById('product-content').innerHTML = `
                <div class="image-container"><div class="image-wrapper"><img src="${item.imgs[0]}"></div></div>
                <div id="live-price">$${item.price.toLocaleString('es-CL')}</div>
                <h1 class="product-title">${item.name}</h1>
                <p style="font-family:'Inter'; font-weight:900; font-size:12px; letter-spacing:1px; margin-bottom:10px;">${item.grams || 'SISTEMA DE ALIMENTACIÓN POR VOLUMEN'}</p>
                <p class="technical-desc">POLLO A LA PLANCHA CON ARROZ BLANCO Y BRÓCOLI COCIDO AL DENTE.</p>
                ${configHTML}
                <div class="purchase-container">
                    <div class="stepper" style="border:none; border-right:1px solid #000; padding:10px;"><button class="stepper-btn" onclick="stepMain(-1)">-</button><span class="stepper-val" id="val-main">1</span><button class="stepper-btn" onclick="stepMain(1)">+</button></div>
                    <button class="buy-btn-new" onclick="addToCart()">AÑADIR AL CARRO</button>
                </div>
                ${!isPack ? `
                <div class="macro-grid">
                    <div class="macro-item"><span class="macro-num">${item.k}</span><span class="macro-label">KCAL</span></div>
                    <div class="macro-item"><span class="macro-num">${item.p}G</span><span class="macro-label">PROT</span></div>
                    <div class="macro-item"><span class="macro-num">${item.c}G</span><span class="macro-label">CARBS</span></div>
                    <div class="macro-item"><span class="macro-num">${item.g}G</span><span class="macro-label">FAT</span></div>
                </div>` : ''}`;
        }

        function addToCart() {
            const pim = conPimienta ? "C/PIMIENTA" : "S/PIMIENTA";
            let name = `${item.name} (${pim})`;
            if (item.id.includes('pack')) name = `${item.name} [${packHC}HC|${packLC}LC] (${pim})`;

            lastAddedCount = mainQty;
            let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            for(let i=0; i<mainQty; i++) { cart.push({ name: name, price: item.price }); }
            localStorage.setItem('preps_cart', JSON.stringify(cart));
            
            updateGlobalCartCount();
            document.getElementById('modal-img').src = item.imgs[0];
            document.getElementById('modal-prod-name').innerText = name;
            document.getElementById('modal-qty-text').innerText = "CANTIDAD AGREGADA: " + mainQty;
            document.getElementById('modal-total-text').innerText = "TOTAL: $" + (item.price * mainQty).toLocaleString('es-CL');
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function undoAddToCart() {
            let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
            if (cart.length >= lastAddedCount) { cart.splice(-lastAddedCount); localStorage.setItem('preps_cart', JSON.stringify(cart)); }
            updateGlobalCartCount(); closeModal();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function updateGlobalCartCount() { document.getElementById('global-cart-count').innerText = (JSON.parse(localStorage.getItem('preps_cart')) || []).length; }
        window.addEventListener('load', () => { updateGlobalCartCount(); renderProduct(); });
    </script>
</body>
</html>
