<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIGURADOR PERSONALIZADO - PREPS</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            text-transform: uppercase;
            padding-bottom: 140px;
        }

        .header-config {
            background: #000;
            color: #fff;
            padding: 30px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 900;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: #fff;
            border: 2px solid #000;
            box-sizing: border-box;
        }

        #protocol-name { 
            text-align: center; 
            font-size: 18px; 
            letter-spacing: 2px; 
            background: #000;
            color: #fff;
            padding: 12px;
            margin-bottom: 30px;
            font-weight: 900;
        }

        .step { margin-bottom: 35px; }
        
        .label-group { 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            margin-bottom: 10px;
            font-size: 13px;
        }

        input[type=range] {
            width: 100%;
            height: 10px;
            background: #eee;
            appearance: none;
            outline: none;
            accent-color: #000;
        }

        .prep-selector {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .prep-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #000;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
        }

        .prep-btn.active { background: #000; color: #fff; }

        .status-monitor {
            background: #f2f2f2;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #000;
        }

        .bar-container { background: #ccc; height: 8px; margin-top: 10px; width: 100%; }
        #progress { background: #000; height: 100%; width: 0%; transition: 0.2s; }

        .price-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            color: #fff;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            border-top: 4px solid #fff;
            z-index: 2000;
        }

        .btn-send {
            background: #fff;
            color: #000;
            padding: 15px;
            border: none;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            max-width: 350px;
        }
    </style>
</head>
<body>

    <div class="header-config">CONFIGURACIÓN DE RENDIMIENTO</div>

    <div class="container">
        <div id="protocol-name">UNIDAD: BASE 300</div>

        <div class="step">
            <div class="label-group"><span>01. POLLO</span> <span id="val-pollo">100G</span></div>
            <input type="range" id="input-pollo" min="0" max="800" step="50" value="100">
            <div class="prep-selector">
                <button class="prep-btn active" id="btn-cocido" onclick="setPrep('COCIDO')">COCIDO VAPOR</button>
                <button class="prep-btn" id="btn-plancha" onclick="setPrep('PLANCHA')">A LA PLANCHA</button>
            </div>
        </div>

        <div class="step">
            <div class="label-group"><span>02. ARROZ</span> <span id="val-arroz">100G</span></div>
            <input type="range" id="input-arroz" min="0" max="800" step="50" value="100">
        </div>

        <div class="step">
            <div class="label-group"><span>03. BRÓCOLI</span> <span id="val-brocoli">100G</span></div>
            <input type="range" id="input-brocoli" min="0" max="800" step="50" value="100">
        </div>

        <div class="status-monitor">
            <div style="font-size: 11px; letter-spacing: 2px; font-weight: bold;">PESO TOTAL: <span id="total-grams">300</span> / 800G</div>
            <div class="bar-container"><div id="progress"></div></div>
        </div>
    </div>

    <div class="price-footer">
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 2px;">TOTAL: <span id="final-price">$0</span></div>
        <button class="btn-send" onclick="sendToWhatsApp()">PEDIR CONFIGURACIÓN</button>
    </div>

    <script>
        let prepPollo = 'COCIDO';
        const inputs = ['input-pollo', 'input-arroz', 'input-brocoli'];
        
        // PRECIOS AJUSTADOS (Referencia High Carb manual = $6.490)
        const precios = { pollo: 22, arroz: 4, brocoli: 6.9, base: 1000 };

        function setPrep(type) {
            prepPollo = type;
            document.getElementById('btn-cocido').classList.toggle('active', type === 'COCIDO');
            document.getElementById('btn-plancha').classList.toggle('active', type === 'PLANCHA');
        }

        function updateValues(e) {
            let p = parseInt(document.getElementById('input-pollo').value);
            let a = parseInt(document.getElementById('input-arroz').value);
            let b = parseInt(document.getElementById('input-brocoli').value);

            let total = p + a + b;

            if (total > 800) {
                if (e) {
                    e.target.value = parseInt(e.target.value) - (total - 800);
                    p = parseInt(document.getElementById('input-pollo').value);
                    a = parseInt(document.getElementById('input-arroz').value);
                    b = parseInt(document.getElementById('input-brocoli').value);
                    total = 800;
                }
            }

            document.getElementById('val-pollo').innerText = p + "G";
            document.getElementById('val-arroz').innerText = a + "G";
            document.getElementById('val-brocoli').innerText = b + "G";
            document.getElementById('total-grams').innerText = total;
            document.getElementById('progress').style.width = (total / 800 * 100) + "%";

            let finalPrice = (p * precios.pollo) + (a * precios.arroz) + (b * precios.brocoli) + precios.base;
            document.getElementById('final-price').innerText = "$" + Math.round(finalPrice).toLocaleString('es-CL');

            // --- NOMBRES EN ESPAÑOL ---
            let proto = "UNIDAD: PERSONALIZADA";
            if (total >= 750) proto = "PROTOCOLO: SOBRECARGA";
            else if (p >= 400 && a <= 100) proto = "MODO: KETO ELITE";
            else if (a >= 450) proto = "PROTOCOLO: CARGA CARB";
            else if (b >= 350) proto = "PROTOCOLO: FIBRA MAX";
            else if (p >= 250 && a >= 250) proto = "PROTOCOLO: SINERGIA";
            else if (total <= 350) proto = "UNIDAD: BASE LIGERA";

            document.getElementById('protocol-name').innerText = proto;
        }

        inputs.forEach(id => document.getElementById(id).addEventListener('input', updateValues));

        function sendToWhatsApp() {
            const p = document.getElementById('input-pollo').value;
            const a = document.getElementById('input-arroz').value;
            const b = document.getElementById('input-brocoli').value;
            const price = document.getElementById('final-price').innerText;
            const proto = document.getElementById('protocol-name').innerText;

            const msg = `NUEVO PEDIDO PERSONALIZADO%0A----------------------%0A${proto}%0A%0A- POLLO (${prepPollo}): ${p}G%0A- ARROZ: ${a}G%0A- BROCOLI: ${b}G%0A%0A----------------------%0ATOTAL: ${price}`;
            window.open(`https://wa.me/569XXXXXXXX?text=${msg}`); 
        }

        updateValues();
    </script>
</body>
</html>
