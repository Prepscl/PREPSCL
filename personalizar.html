<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIGURADOR CUSTOM V1.0 - PREPS</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            text-transform: uppercase;
            padding-bottom: 140px;
        }

        .header-config {
            background: #000;
            color: #fff;
            padding: 30px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 900;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: #fff;
            border: 2px solid #000;
            box-sizing: border-box;
        }

        /* NOMBRE DEL PROTOCOLO RESALTADO */
        #protocol-name { 
            text-align: center; 
            font-size: 20px; 
            letter-spacing: 3px; 
            background: #000;
            color: #fff;
            padding: 10px;
            margin-bottom: 30px;
        }

        .step { margin-bottom: 35px; }
        
        .label-group { 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            margin-bottom: 10px;
            font-size: 13px;
        }

        input[type=range] {
            width: 100%;
            height: 10px;
            background: #eee;
            appearance: none;
            outline: none;
            accent-color: #000;
        }

        .prep-selector {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .prep-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #000;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .prep-btn.active { background: #000; color: #fff; }

        .status-monitor {
            background: #f2f2f2;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #000;
        }

        .bar-container { background: #ccc; height: 8px; margin-top: 10px; width: 100%; }
        #progress { background: #000; height: 100%; width: 0%; transition: 0.2s; }

        .price-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            color: #fff;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            border-top: 4px solid #fff;
            z-index: 2000;
        }

        .btn-send {
            background: #fff;
            color: #000;
            padding: 15px;
            border: none;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            max-width: 350px;
        }
    </style>
</head>
<body>

    <div class="header-config">SYSTEM CONFIG: CUSTOM PREP</div>

    <div class="container">
        <div id="protocol-name">UNIT: CORE 300</div>

        <div class="step">
            <div class="label-group"><span>01. POLLO (PRO)</span> <span id="val-pollo">100G</span></div>
            <input type="range" id="input-pollo" min="0" max="800" step="50" value="100">
            <div class="prep-selector">
                <button class="prep-btn active" id="btn-cocido" onclick="setPrep('COCIDO')">COCIDO VAPOR</button>
                <button class="prep-btn" id="btn-plancha" onclick="setPrep('PLANCHA')">A LA PLANCHA</button>
            </div>
        </div>

        <div class="step">
            <div class="label-group"><span>02. ARROZ (CARB)</span> <span id="val-arroz">100G</span></div>
            <input type="range" id="input-arroz" min="0" max="800" step="50" value="100">
        </div>

        <div class="step">
            <div class="label-group"><span>03. BRÓCOLI (FIBER)</span> <span id="val-brocoli">100G</span></div>
            <input type="range" id="input-brocoli" min="0" max="800" step="50" value="100">
        </div>

        <div class="status-monitor">
            <div style="font-size: 11px; letter-spacing: 2px; font-weight: bold;">CARGA TOTAL: <span id="total-grams">300</span> / 800G</div>
            <div class="bar-container"><div id="progress"></div></div>
        </div>
    </div>

    <div class="price-footer">
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 2px;">TOTAL: <span id="final-price">$0</span></div>
        <button class="btn-send" onclick="sendToWhatsApp()">GENERAR ORDEN</button>
    </div>

    <script>
        let prepPollo = 'COCIDO';
        const inputs = ['input-pollo', 'input-arroz', 'input-brocoli'];
        
        // PRECIOS CON MARGEN 98% (Sobre costos: Pollo 9.06, Arroz 0.86, Brócoli 2.27, Envase 450)
        const precios = { pollo: 18, arroz: 1.7, brocoli: 4.5, base: 900 };

        function setPrep(type) {
            prepPollo = type;
            document.getElementById('btn-cocido').classList.toggle('active', type === 'COCIDO');
            document.getElementById('btn-plancha').classList.toggle('active', type === 'PLANCHA');
        }

        function updateValues(e) {
            let p = parseInt(document.getElementById('input-pollo').value);
            let a = parseInt(document.getElementById('input-arroz').value);
            let b = parseInt(document.getElementById('input-brocoli').value);

            let total = p + a + b;

            // Lógica no invasiva: Bloqueo en 800g
            if (total > 800) {
                if (e) {
                    const diff = total - 800;
                    e.target.value = parseInt(e.target.value) - diff;
                    p = parseInt(document.getElementById('input-pollo').value);
                    a = parseInt(document.getElementById('input-arroz').value);
                    b = parseInt(document.getElementById('input-brocoli').value);
                    total = 800;
                }
            }

            document.getElementById('val-pollo').innerText = p + "G";
            document.getElementById('val-arroz').innerText = a + "G";
            document.getElementById('val-brocoli').innerText = b + "G";
            document.getElementById('total-grams').innerText = total;
            document.getElementById('progress').style.width = (total / 800 * 100) + "%";

            // Cálculo Precio Final
            let finalPrice = (p * precios.pollo) + (a * precios.arroz) + (b * precios.brocoli) + precios.base;
            document.getElementById('final-price').innerText = "$" + Math.round(finalPrice).toLocaleString('es-CL');

            // --- LÓGICA DE NOMBRES DE PROTOCOLO ---
            let proto = "UNIT: CUSTOM-CORE";
            
            if (total >= 750) {
                proto = "PROTOCOL: OVERLOAD";
            } else if (p >= 400 && a <= 100) {
                proto = "MODE: KETO-STRIKE";
            } else if (a >= 450) {
                proto = "PROTOCOL: GLYCO-LOAD";
            } else if (b >= 350) {
                proto = "MODE: FIBER-MAX";
            } else if (p >= 250 && a >= 250) {
                proto = "PROTOCOL: SYNERGY";
            } else if (total <= 350) {
                proto = "UNIT: LIGHT-OPS";
            }

            document.getElementById('protocol-name').innerText = proto;
        }

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', updateValues);
        });

        function sendToWhatsApp() {
            const p = document.getElementById('input-pollo').value;
            const a = document.getElementById('input-arroz').value;
            const b = document.getElementById('input-brocoli').value;
            const price = document.getElementById('final-price').innerText;
            const proto = document.getElementById('protocol-name').innerText;

            const msg = `NUEVO PEDIDO CUSTOM V1.0%0A----------------------%0A${proto}%0A%0A- POLLO (${prepPollo}): ${p}G%0A- ARROZ: ${a}G%0A- BROCOLI: ${b}G%0A%0A----------------------%0ATOTAL: ${price}`;
            window.open(`https://wa.me/569XXXXXXXX?text=${msg}`); // Reemplaza con tu número
        }

        updateValues();
    </script>
</body>
</html>
