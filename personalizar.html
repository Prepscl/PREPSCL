<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIGURADOR PERSONALIZADO - PREPS</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            text-transform: uppercase;
            padding-bottom: 140px;
        }

        .header-config {
            background: #000;
            color: #fff;
            padding: 30px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 900;
            border-bottom: 4px solid #fff;
        }

        .main-wrapper { 
            display: flex; 
            max-width: 1100px; 
            margin: 40px auto; 
            gap: 25px; 
            padding: 0 20px;
            flex-wrap: wrap; 
        }

        .controls-column { 
            flex: 1; 
            min-width: 320px; 
            background: #fff; 
            border: 2px solid #000; 
            padding: 35px; 
            box-sizing: border-box; 
        }

        .monitor-column { 
            width: 320px; 
            background: #000; 
            color: #fff; 
            padding: 35px; 
            border: 2px solid #000; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }

        #protocol-name { 
            text-align: center; 
            font-size: 16px; 
            letter-spacing: 2px; 
            border-bottom: 1px solid #fff; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
            font-weight: 900;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }
        .macro-label { font-size: 10px; color: #888; letter-spacing: 1px; }
        .macro-val { font-size: 26px; font-weight: 900; }
        .unit { font-size: 12px; margin-left: 5px; color: #888; }

        .step { margin-bottom: 35px; }
        .label-group { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; font-size: 13px; }
        input[type=range] { width: 100%; height: 10px; background: #eee; appearance: none; outline: none; accent-color: #000; }
        
        .prep-selector { display: flex; gap: 5px; margin-top: 15px; }
        .prep-btn { flex: 1; padding: 12px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: bold; transition: 0.2s; }
        .prep-btn.active { background: #000; color: #fff; }

        .status-info { font-size: 10px; text-align: center; color: #999; margin-top: 25px; letter-spacing: 1px; }

        .price-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            color: #fff;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            border-top: 4px solid #fff;
            z-index: 2000;
        }

        .btn-send {
            background: #fff;
            color: #000;
            padding: 15px;
            border: none;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            max-width: 400px;
        }

        @media (max-width: 850px) {
            .monitor-column { width: 100%; order: -1; margin-bottom: 0; }
            .main-wrapper { margin-top: 10px; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header-config">SISTEMA CONFIGURADOR PREPS</div>

    <div class="main-wrapper">
        <div class="controls-column">
            <div class="step">
                <div class="label-group"><span>01. PROTEÍNA (POLLO)</span> <span id="val-pollo">100G</span></div>
                <input type="range" id="input-pollo" min="0" max="800" step="50" value="100">
                <div class="prep-selector">
                    <button class="prep-btn active" id="btn-cocido" onclick="setPrep('COCIDO')">COCIDO VAPOR</button>
                    <button class="prep-btn" id="btn-plancha" onclick="setPrep('PLANCHA')">A LA PLANCHA</button>
                </div>
            </div>

            <div class="step">
                <div class="label-group"><span>02. ARROZ (CARBOS)</span> <span id="val-arroz">100G</span></div>
                <input type="range" id="input-arroz" min="0" max="800" step="50" value="100">
            </div>

            <div class="step">
                <div class="label-group"><span>03. BRÓCOLI (FIBRA)</span> <span id="val-brocoli">100G</span></div>
                <input type="range" id="input-brocoli" min="0" max="800" step="50" value="100">
            </div>

            <div class="status-info">PESO MÁXIMO PERMITIDO: 800G</div>
        </div>

        <div class="monitor-column">
            <div id="protocol-name">UNIDAD: BASE LIGERA</div>
            
            <div class="macro-item">
                <span class="macro-label">PROTEÍNA</span>
                <div><span id="m-prot" class="macro-val">0</span><span class="unit">G</span></div>
            </div>
            <div class="macro-item">
                <span class="macro-label">CARBOS</span>
                <div><span id="m-carb" class="macro-val">0</span><span class="unit">G</span></div>
            </div>
            <div class="macro-item">
                <span class="macro-label">GRASAS</span>
                <div><span id="m-fat" class="macro-val">0</span><span class="unit">G</span></div>
            </div>
            <div class="macro-item" style="border: none; margin-bottom: 0;">
                <span class="macro-label">ENERGÍA</span>
                <div><span id="m-kcal" class="macro-val">0</span><span class="unit">KCAL</span></div>
            </div>
        </div>
    </div>

    <div class="price-footer">
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 2px;">TOTAL: <span id="final-price">$0</span></div>
        <button class="btn-send" onclick="sendToWhatsApp()">PEDIR CONFIGURACIÓN</button>
    </div>

    <script>
        let prepPollo = 'COCIDO'; // Default Cocido para calzar con Menús Fijos
        const inputs = ['input-pollo', 'input-arroz', 'input-brocoli'];
        
        // --- INGENIERÍA DE PRECISIÓN ABSOLUTA (VALORES POR 1 GRAMO) ---
        // Calibrados para que: 200P + 300A + 100B = 73P / 92C / 19G / 830K
        const pollo_macros = {
            'COCIDO': { p: 0.31, c: 0, g: 0.085, k: 2.035 },
            'PLANCHA': { p: 0.345, c: 0, g: 0.085, k: 2.125 }
        };
        const arroz_macros = { p: 0.0266, c: 0.2866, g: 0.0066, k: 1.32 }; 
        const brocoli_macros = { p: 0.03, c: 0.06, g: 0, k: 0.27 };         

        const precios = { pollo: 22, arroz: 4, brocoli: 5.9, base: 1000 };

        function setPrep(type) {
            prepPollo = type;
            document.getElementById('btn-cocido').classList.toggle('active', type === 'COCIDO');
            document.getElementById('btn-plancha').classList.toggle('active', type === 'PLANCHA');
            updateValues();
        }

        function updateValues(e) {
            let p = parseInt(document.getElementById('input-pollo').value);
            let a = parseInt(document.getElementById('input-arroz').value);
            let b = parseInt(document.getElementById('input-brocoli').value);

            let total = p + a + b;

            if (total > 800) {
                if (e) {
                    e.target.value = parseInt(e.target.value) - (total - 800);
                    p = parseInt(document.getElementById('input-pollo').value);
                    a = parseInt(document.getElementById('input-arroz').value);
                    b = parseInt(document.getElementById('input-brocoli').value);
                    total = 800;
                }
            }

            document.getElementById('val-pollo').innerText = p + "G";
            document.getElementById('val-arroz').innerText = a + "G";
            document.getElementById('val-brocoli').innerText = b + "G";

            // CÁLCULO DE MACROS CON PRECISIÓN DE LIBRETA
            let protTotal = (p * pollo_macros[prepPollo].p) + (a * arroz_macros.p) + (b * brocoli_macros.p);
            let carbTotal = (a * arroz_macros.c) + (b * brocoli_macros.c);
            let fatTotal = (p * pollo_macros[prepPollo].g) + (a * arroz_macros.g);
            let kcalTotal = (p * pollo_macros[prepPollo].k) + (a * arroz_macros.k) + (b * brocoli_macros.k);

            // Actualizar Monitor
            document.getElementById('m-prot').innerText = Math.round(protTotal);
            document.getElementById('m-carb').innerText = Math.round(carbTotal);
            document.getElementById('m-fat').innerText = Math.round(fatTotal);
            document.getElementById('m-kcal').innerText = Math.round(kcalTotal);

            // Precio Final
            let finalPrice = (p * precios.pollo) + (a * precios.arroz) + (b * precios.brocoli) + precios.base;
            document.getElementById('final-price').innerText = "$" + Math.round(finalPrice).toLocaleString('es-CL');

            // --- NOMBRES EN ESPAÑOL ---
            let proto = "UNIDAD: PERSONALIZADA";
            if (total >= 750) proto = "PROTOCOLO: SOBRECARGA";
            else if (p >= 400 && a <= 100) proto = "MODO: KETO ELITE";
            else if (a >= 450) proto = "PROTOCOLO: CARGA CARB";
            else if (b >= 350) proto = "PROTOCOLO: FIBRA MAX";
            else if (p >= 250 && a >= 250) proto = "PROTOCOLO: SINERGIA";
            else if (total <= 350) proto = "UNIDAD: BASE LIGERA";

            document.getElementById('protocol-name').innerText = proto;
        }

        inputs.forEach(id => document.getElementById(id).addEventListener('input', updateValues));

        function sendToWhatsApp() {
            const p = document.getElementById('input-pollo').value;
            const a = document.getElementById('input-arroz').value;
            const b = document.getElementById('input-brocoli').value;
            const price = document.getElementById('final-price').innerText;
            const proto = document.getElementById('protocol-name').innerText;
            const prot = document.getElementById('m-prot').innerText;
            const carb = document.getElementById('m-carb').innerText;
            const kcal = document.getElementById('m-kcal').innerText;

            const msg = `NUEVO PEDIDO PERSONALIZADO%0A----------------------%0A${proto}%0A%0A- POLLO (${prepPollo}): ${p}G%0A- ARROZ: ${a}G%0A- BROCOLI: ${b}G%0A%0A- PROTEÍNA: ${prot}G | CARBOS: ${carb}G%0A- ENERGÍA TOTAL: ${kcal} KCAL%0A----------------------%0ATOTAL: ${price}`;
            window.open(`https://wa.me/569XXXXXXXX?text=${msg}`); 
        }

        updateValues();
    </script>
</body>
</html>
