<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - PREPS Chile</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link rel="apple-touch-icon" href="img/logo-preps.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* FONDO GRIS CLARO IGUAL A HOME */
        body {
            background-color: #f2f2f2;
            font-family: 'Courier New', Courier, monospace;
        }

        /* HEADER REFRESKO: Logo pequeño izquierda, Menú derecha */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 50px;
            background: #f2f2f2;
            border-bottom: 1px solid #000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Esto evita que el logo se vea gigante */
        .logo-link img {
            height: 35px; 
            width: auto;
            display: block;
        }

        .main-nav {
            display: flex;
            gap: 30px;
        }

        .main-nav a {
            text-decoration: none;
            color: #000;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .main-nav a.active {
            text-decoration: underline;
            font-weight: bold;
        }

        /* CUADRÍCULA DE PRODUCTOS */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 60px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .producto-card {
            border: 2px solid #000;
            background: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #000;
            transition: 0.3s;
        }

        .producto-card:hover {
            transform: translateY(-5px);
        }

        .producto-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 2px solid #000;
        }

        .producto-card .info {
            padding: 25px;
        }

        .producto-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .producto-card .price {
            font-size: 20px;
            font-weight: 900;
        }

        .section-title {
            text-align: center;
            letter-spacing: 4px;
            margin-top: 60px;
            font-size: 24px;
        }

        footer {
            background: #000;
            color: #fff;
            padding: 60px;
            text-align: center;
            font-size: 12px;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link">
            <img src="img/logo-preps.png" alt="PREPS Chile">
        </a>
        <nav class="main-nav">
            <a href="index.html">HOGAR</a>
            <a href="catalogo.html" class="active">CATALOGAR</a>
            <a href="nosotros.html">SOBRE NOSOTROS</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">NUESTROS MENÚS</h2>
        
        <div class="grid-catalogo">
            <a href="producto.html?id=highcarb" class="producto-card">
                <img src="img/menu1.jpg" alt="High Carb">
                <div class="info">
                    <h3>POWER BREAST HIGH CARB</h3>
                    <div class="price">$7.000 CLP</div>
                </div>
            </a>
            
            <a href="producto.html?id=lowcarb" class="producto-card">
                <img src="img/menu2.jpg" alt="Low Carb">
                <div class="info">
                    <h3>POWER BREAST LOW CARB</h3>
                    <div class="price">$6.500 CLP</div>
                </div>
            </a>
        </div>
        
        <h2 class="section-title">PACKS SEMANALES</h2>
        
        <div class="grid-catalogo">
            <a href="producto.html?id=pack5" class="producto-card">
                <img src="img/pack5.jpg" alt="Pack 5">
                <div class="info">
                    <h3>PACK 5 COMIDAS</h3>
                    <div class="price">$30.000 CLP</div>
                </div>
            </a>
            
            <a href="producto.html?id=pack10" class="producto-card">
                <img src="img/pack10.jpg" alt="Pack 10">
                <div class="info">
                    <h3>PACK 10 COMIDAS</h3>
                    <div class="price">$60.000 CLP</div>
                </div>
            </a>
            
            <a href="producto.html?id=pack30" class="producto-card">
                <img src="img/pack30.jpg" alt="Pack 30">
                <div class="info">
                    <h3>PACK 30 COMIDAS</h3>
                    <div class="price">$180.000 CLP</div>
                </div>
            </a>
        </div>
    </main>

    <footer>
        © 2026 PREPS CHILE - TODOS LOS DERECHOS RESERVADOS
    </footer>

</body>
</html>
