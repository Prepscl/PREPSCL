<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    
    <title>Catálogo - PREPS Chile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link rel="apple-touch-icon" href="img/logo-preps.png">

    <style>
        body {
            background-color: #f2f2f2;
            color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 1. SCROLL REVEAL CLASE */
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: all 1.2s cubic-bezier(0.17, 0.55, 0.55, 1); 
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }

        /* HEADER */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 50px;
            background: #f2f2f2;
            border-bottom: 1px solid #000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-link img { height: 35px; width: auto; display: block; }
        .main-nav { display: flex; gap: 30px; }
        .main-nav a {
            text-decoration: none;
            color: #000;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 400;
            transition: 0.3s;
        }
        .main-nav a.active { font-weight: 900; border-bottom: 2px solid #000; }

        /* TÍTULOS INTER 900 (ESTILO DROPS IS HOT) */
        .section-title {
            text-align: center;
            letter-spacing: -1.5px;
            margin-top: 80px;
            font-size: 32px;
            font-weight: 900;
            line-height: 0.9;
        }

        /* GRID CON RELIEVE */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px 20px 60px;
            max-width: 1200px;
            margin: auto;
        }

        .producto-card {
            border: 1px solid #ddd;
            background: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #000;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .producto-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: #000;
        }

        .producto-card img { width: 100%; height: 300px; object-fit: cover; border-bottom: 1px solid #eee; }
        .producto-card .info { padding: 25px; flex-grow: 1; }
        
        .producto-card h3 { 
            font-size: 16px; 
            font-weight: 900; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px; 
        }

        /* PRECIOS EN COURIER PARA PRECISIÓN */
        .producto-card .price { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 20px; 
            font-weight: 900; 
        }

        .card-custom-black { background: #000 !important; border: 1px solid #000 !important; }
        .card-custom-black .info h3, .card-custom-black .info .price { color: #fff !important; }

        footer {
            background: #000; color: #fff; padding: 60px 20px; text-align: center;
            font-size: 10px; margin-top: 80px; letter-spacing: 2px;
        }
        .social-link img { width: 25px; filter: invert(1); opacity: 0.5; transition: 0.3s; margin-bottom: 20px; }
        .social-link:hover img { opacity: 1; }

        @media (max-width: 600px) {
            .main-header { flex-direction: column; padding: 20px; gap: 15px; }
            .section-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS Chile"></a>
        <nav class="main-nav">
            <a href="index.html">HOGAR</a>
            <a href="catalogo.html" class="active">CATALOGAR</a>
            <a href="nosotros.html">NOSOTROS</a>
        </nav>
    </header>

    <main>
        <section class="reveal">
            <h2 class="section-title">NUESTROS MENÚS</h2>
            <div class="grid-catalogo">
                <a href="producto.html?id=highcarb" class="producto-card">
                    <img src="img/menu1.jpg" alt="High Carb">
                    <div class="info"><h3>POWER BREAST HIGH CARB</h3><div class="price">$7.000</div></div>
                </a>
                <a href="producto.html?id=lowcarb" class="producto-card">
                    <img src="img/menu2.jpg" alt="Low Carb">
                    <div class="info"><h3>POWER BREAST LOW CARB</h3><div class="price">$6.500</div></div>
                </a>
                <a href="personalizar.html" class="producto-card card-custom-black">
                    <img src="img/custom-prep.jpg" alt="Personalizar">
                    <div class="info"><h3>CUSTOM PERFORMANCE V1.0</h3><div class="price">DESDE $5.000</div></div>
                </a>
            </div>
        </section>
        
        <section class="reveal">
            <h2 class="section-title">PLANES PERFORMANCE</h2>
            <div class="grid-catalogo">
                <a href="https://wa.me/56941892028?text=Hola,%20quiero%20el%20pack%20de%205%20unidades" class="producto-card">
                    <img src="img/pack5.jpg" alt="Pack 5">
                    <div class="info"><h3>05 PACKS PERFORMANCE</h3><div class="price">$24.900</div></div>
                </a>
                <a href="https://wa.me/56941892028?text=Hola,%20quiero%20el%20pack%20de%2015%20unidades" class="producto-card">
                    <img src="img/pack15.jpg" alt="Pack 15">
                    <div class="info"><h3>15 PACKS PERFORMANCE</h3><div class="price">$72.900</div></div>
                </a>
                <a href="https://wa.me/56941892028?text=Hola,%20quiero%20el%20pack%20de%2028%20unidades" class="producto-card">
                    <img src="img/pack28.jpg" alt="Pack 28">
                    <div class="info"><h3>28 PACKS PERFORMANCE</h3><div class="price">$129.900</div></div>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <a href="https://www.instagram.com/prepscl/" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram"></a>
        <p>© 2026 PREPS CHILE - PRECISION DINING</p>
    </footer>

    <script>
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        window.addEventListener("load", reveal);
    </script>

</body>
</html>
