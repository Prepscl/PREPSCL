<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - PREPS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 30px; 
            padding: 40px 20px; 
            max-width: 1200px; 
            margin: auto;
        }
        .item { 
            border: 2px solid #000; 
            text-align: center; 
            text-decoration: none; 
            color: #000;
            transition: 0.3s;
        }
        .item:hover { transform: translateY(-5px); }
        .item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-bottom: 2px solid #000; }
        .item-info { padding: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <div class="hero-slogan">DISEÑADO PARA TU RENDIMIENTO</div>
        <nav>
            <a href="index.html">Hogar</a>
            <a href="catalogo.html" class="active">Catalogar</a>
            <a href="nosotros.html">Sobre nosotros</a>
        </nav>
    </header>

    <div class="grid">
        <a href="producto.html?id=highcarb" class="item">
            <img src="img/menu1.jpg">
            <div class="item-info"><h3>POWER BREAST HIGH CARB</h3><p>$7.000 CLP</p></div>
        </a>
        <a href="producto.html?id=lowcarb" class="item">
            <img src="img/menu2.jpg">
            <div class="item-info"><h3>POWER BREAST LOW CARB</h3><p>$6.500 CLP</p></div>
        </a>
        <a href="producto.html?id=pack5" class="item">
            <img src="img/pack5.jpg">
            <div class="item-info"><h3>PACK 5 COMIDAS</h3><p>$30.000 CLP</p></div>
        </a>
        <a href="producto.html?id=pack10" class="item">
            <img src="img/pack10.jpg">
            <div class="item-info"><h3>PACK 10 COMIDAS</h3><p>$60.000 CLP</p></div>
        </a>
        <a href="producto.html?id=pack30" class="item">
            <img src="img/pack30.jpg">
            <div class="item-info"><h3>PACK 30 COMIDAS</h3><p>$180.000 CLP</p></div>
        </a>
    </div>

    <footer>© 2026 PREPS - TODOS LOS DERECHOS RESERVADOS</footer>
</body>
</html>
