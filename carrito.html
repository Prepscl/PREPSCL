<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>SISTEMA DE CARGA - PREPS</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #25D366; --dark: #000; --light: #f2f2f2; --neon: #39FF14; }
        body { background-color: var(--light); color: var(--dark); font-family: 'Courier New', monospace; margin: 0; text-transform: uppercase; -webkit-font-smoothing: antialiased; }

        /* HEADER */
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        .main-nav { display: flex; align-items: center; gap: 30px; }
        .main-nav a { text-decoration: none; color: #000; font-size: 13px; letter-spacing: 2px; }

        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        
        /* DASHBOARD DINÁMICO */
        .biomass-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .macro-card { background: #000; color: #fff; padding: 15px; text-align: center; border: 1px solid #333; }
        .macro-label { font-size: 8px; opacity: 0.6; display: block; margin-bottom: 5px; }
        .macro-total-val { font-family: 'Inter'; font-weight: 900; font-size: 18px; color: var(--neon); }

        /* BARRA */
        .progress-container { background: #ddd; height: 8px; width: 100%; margin: 10px 0 30px; border-radius: 10px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; transition: 1s ease; background: #ff4444; }
        
        .cart-title { font-family: 'Inter'; font-weight: 900; font-size: 24px; letter-spacing: -1px; margin-top: 40px; text-align: center; text-transform: uppercase; }

        /* TABLA */
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border: 1px solid #000; }
        .cart-row td { padding: 15px; border-bottom: 1px solid #eee; font-size: 12px; }
        .qty-controls { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .btn-qty { background: #000; color: #fff; border: none; width: 25px; height: 25px; cursor: pointer; font-weight: 900; }

        .summary-box { background: #000; color: #fff; padding: 40px; text-align: center; margin-top: 20px; }
        .total-amount { font-family: 'Inter'; font-weight: 900; font-size: 36px; color: #fff; margin: 15px 0; }
        .btn-checkout { background: var(--accent); color: #000; padding: 22px; font-family: 'Inter'; font-weight: 900; font-size: 16px; width: 100%; border: none; cursor: pointer; }

        #console-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: var(--neon); padding: 40px; box-sizing: border-box; }

        @media (max-width: 600px) {
            .main-header { padding: 15px 20px; }
            .main-nav { gap: 15px; }
            .biomass-dashboard { grid-template-columns: 1fr; }
            .cart-row td { padding: 10px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav class="main-nav">
            <a href="index.html">HOME</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
        </nav>
    </header>

    <div class="container" id="main-container">
        <div id="cart-content"></div>
    </div>

    <div id="console-modal">
        <div id="console-text" style="font-family: monospace;"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
        
        // Base de datos de macros exacta a tu libreta
        const macroDB = {
            "HIGH CARB": {k: 830, p: 73, c: 92},
            "LOW CARB": {k: 632, p: 69, c: 49},
            "PACK 5": {k: 3600, p: 350, c: 300},
            "PACK 15": {k: 10800, p: 1050, c: 900},
            "PACK 28": {k: 20000, p: 2000, c: 1700}
        };

        function renderCart() {
            const container = document.getElementById('cart-content');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <p style="font-size:12px; letter-spacing:4px; opacity:0.5;">SISTEMA EN ESPERA...</p>
                        <h1 class="cart-title">INVENTARIO VACÍO</h1>
                        <br><br>
                        <a href="catalogo.html" style="background:#000; color:#fff; padding:20px 40px; text-decoration:none; font-weight:900; display:inline-block;">INICIAR CARGA</a>
                    </div>`;
                return;
            }

            // Agrupar productos
            const grouped = cart.reduce((acc, item) => {
                acc[item.name] = acc[item.name] || { count: 0, price: item.price };
                acc[item.name].count++;
                return acc;
            }, {});

            let totalMoney = 0, totalKcal = 0, totalProt = 0, totalCarb = 0;
            let tableRows = "";

            for (const [name, data] of Object.entries(grouped)) {
                totalMoney += data.price * data.count;
                
                // Buscar macros en la DB
                let key = Object.keys(macroDB).find(k => name.toUpperCase().includes(k));
                if(key) {
                    totalKcal += macroDB[key].k * data.count;
                    totalProt += macroDB[key].p * data.count;
                    totalCarb += macroDB[key].c * data.count;
                } else if (name.includes("CUSTOM")) {
                    // Si es custom estimamos sobre un High Carb si no hay datos específicos
                    totalKcal += 750 * data.count; totalProt += 70 * data.count;
                }

                tableRows += `
                    <tr class="cart-row">
                        <td><span style="font-weight:900;">${name}</span></td>
                        <td>
                            <div class="qty-controls">
                                <button class="btn-qty" onclick="changeQty('${name}', -1)">-</button>
                                <span style="font-weight:900; min-width:20px; text-align:center;">${data.count}</span>
                                <button class="btn-qty" onclick="changeQty('${name}', 1)">+</button>
                            </div>
                        </td>
                        <td style="text-align:right; font-weight:900;">$${(data.price * data.count).toLocaleString('es-CL')}</td>
                    </tr>`;
            }

            // Inyectar Dashboard + Tabla + Formulario
            container.innerHTML = `
                <div class="cart-title">REPORTE DE ESTADO</div>
                <div class="progress-label" style="margin-top:20px;">
                    <span>EFICIENCIA SEMANAL</span> 
                    <span id="status-tag" style="color:red;">CALCULANDO...</span>
                </div>
                <div class="progress-container"><div id="progress-bar"></div></div>

                <div class="biomass-dashboard">
                    <div class="macro-card"><span class="macro-label">TOTAL KCAL</span><span class="macro-total-val">${Math.round(totalKcal).toLocaleString()}</span></div>
                    <div class="macro-card"><span class="macro-label">TOTAL PROT</span><span class="macro-total-val">${Math.round(totalProt)}G</span></div>
                    <div class="macro-card"><span class="macro-label">TOTAL CARB</span><span class="macro-total-val">${Math.round(totalCarb)}G</span></div>
                </div>

                <table class="cart-table">${tableRows}</table>

                <div style="background:#fff; border:1px solid #000; padding:30px; margin-bottom:20px; text-align:left;">
                    <span style="font-weight:900; font-size:10px; display:block; margin-bottom:20px; opacity:0.5;">[DATOS DE DESPACHO]</span>
                    <input type="text" id="cust-name" placeholder="NOMBRE COMPLETO" style="width:100%; padding:15px; margin-bottom:15px; border:1px solid #eee; font-family:inherit;">
                    <select id="delivery-method" onchange="toggleDelivery()" style="width:100%; padding:15px; font-family:inherit;">
                        <option value="RETIRO">RETIRO LOCAL (SANTIAGO)</option>
                        <option value="DELIVERY">DELIVERY ZONAL (SANTIAGO)</option>
                    </select>
                    <div id="delivery-options" style="display:none; margin-top:15px;">
                        <select id="comuna" style="width:100%; padding:15px; font-family:inherit;">
                            <option value="VITACURA">VITACURA</option>
                            <option value="LAS CONDES">LAS CONDES</option>
                            <option value="PROVIDENCIA">PROVIDENCIA</option>
                            <option value="LO BARNECHEA">LO BARNECHEA</option>
                            <option value="METRO">METRO A CONVENIR</option>
                        </select>
                    </div>
                </div>

                <div class="summary-box">
                    <span style="font-size: 10px; letter-spacing: 4px; opacity: 0.5;">TOTAL SISTEMA</span>
                    <div class="total-amount">$${totalMoney.toLocaleString('es-CL')}</div>
                    <button class="btn-checkout" onclick="startConsole()">FINALIZAR PROTOCOLO (WSP)</button>
                </div>
            `;

            // Actualizar barra de progreso después de renderizar
            setTimeout(() => {
                const bar = document.getElementById('progress-bar');
                const tag = document.getElementById('status-tag');
                let pct = (cart.length / 10) * 100;
                if(pct > 100) pct = 100;
                bar.style.width = pct + "%";
                if(pct < 40) { bar.style.background = "#ff4444"; tag.innerText = "BAJA"; }
                else if(pct < 80) { bar.style.background = "#ffcc00"; tag.innerText = "MEDIA"; }
                else { bar.style.background = "#39FF14"; tag.innerText = "OPTIMIZADA"; }
            }, 100);
        }

        function toggleDelivery() {
            const options = document.getElementById('delivery-options');
            if(options) options.style.display = (document.getElementById('delivery-method').value === 'DELIVERY') ? 'block' : 'none';
        }

        function changeQty(name, delta) {
            if(delta > 0) {
                const item = cart.find(i => i.name === name);
                cart.push({...item});
            } else {
                const index = cart.findIndex(i => i.name === name);
                cart.splice(index, 1);
            }
            localStorage.setItem('preps_cart', JSON.stringify(cart));
            renderCart();
        }

        function startConsole() {
            const name = document.getElementById('cust-name').value;
            if(!name) { alert("INGRESA TU NOMBRE PARA EL TICKET"); return; }
            const modal = document.getElementById('console-modal');
            const text = document.getElementById('console-text');
            modal.style.display = 'flex';
            text.innerHTML = "";
            const lines = ["> INICIANDO PROTOCOLO...", "> COMPILANDO BIOMASA...", "> GENERANDO TICKET...", "> REDIRECCIONANDO..."];
            let i = 0;
            const intv = setInterval(() => {
                text.innerHTML += lines[i] + "<br>"; i++;
                if(i >= lines.length) { clearInterval(intv); setTimeout(sendToWhatsApp, 600); }
            }, 400);
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const method = document.getElementById('delivery-method').value;
            const comuna = (method === 'DELIVERY') ? document.getElementById('comuna').value : 'RETIRO';
            const totalVal = document.querySelector('.total-amount').innerText;

            let msg = `🧪 *ORDEN PREPS*%0A👤 *CLIENTE:* ${name.toUpperCase()}%0A📍 *LOG:* ${method} (${comuna})%0A%0A`;
            const grouped = cart.reduce((acc, item) => { acc[item.name] = (acc[item.name] || 0) + 1; return acc; }, {});
            for (const [n, c] of Object.entries(grouped)) { msg += `• ${c}x ${n}%0A`; }
            msg += `%0A💰 *TOTAL:* ${totalVal}`;
            window.location.href = `https://wa.me/56941892028?text=${msg}`;
        }

        window.addEventListener('load', renderCart);
    </script>
</body>
</html>
