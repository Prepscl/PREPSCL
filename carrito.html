<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>SISTEMA DE CARGA - PREPS</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #25D366; --dark: #000; --light: #f2f2f2; --neon: #39FF14; }
        body { background-color: var(--light); color: var(--dark); font-family: 'Courier New', monospace; margin: 0; text-transform: uppercase; -webkit-font-smoothing: antialiased; }

        /* HEADER */
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        .main-nav { display: flex; align-items: center; gap: 30px; }
        .main-nav a { text-decoration: none; color: #000; font-size: 13px; letter-spacing: 2px; }

        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        
        /* PANTALLAS DIGITALES REALISTAS */
        .biomass-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 25px 0; }
        .macro-card { 
            background: linear-gradient(145deg, #111, #000); 
            color: #fff; 
            padding: 20px 10px; 
            text-align: center; 
            border: 1px solid #333; 
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.05);
            position: relative;
            overflow: hidden;
        }
        .macro-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); opacity: 0.3; }
        .macro-label { font-size: 8px; opacity: 0.5; display: block; margin-bottom: 8px; letter-spacing: 2px; }
        .macro-total-val { font-family: 'Inter'; font-weight: 900; font-size: 22px; color: var(--neon); text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }

        /* BARRA */
        .progress-container { background: #ddd; height: 6px; width: 100%; margin: 10px 0 30px; border-radius: 10px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; transition: 1.5s ease; background: #ff4444; }
        
        .cart-title { font-family: 'Inter'; font-weight: 900; font-size: 24px; letter-spacing: -1px; margin-top: 40px; text-align: center; }

        /* TABLA */
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border: 1px solid #000; }
        .cart-row td { padding: 18px; border-bottom: 1px solid #eee; font-size: 11px; }
        .qty-controls { display: flex; align-items: center; gap: 12px; justify-content: center; background: #f9f9f9; padding: 5px; border-radius: 4px; }
        .btn-qty { background: #000; color: #fff; border: none; width: 28px; height: 28px; cursor: pointer; font-weight: 900; transition: 0.2s; }
        .btn-qty:active { transform: scale(0.9); }

        /* FORM SECTIONS */
        .form-box { background:#fff; border:1px solid #000; padding:30px; margin-bottom:20px; text-align:left; }
        .form-label { font-weight:900; font-size:10px; display:block; margin-bottom:20px; opacity:0.5; letter-spacing:1px; }
        input, select { width:100%; padding:15px; margin-bottom:15px; border:1px solid #eee; font-family:inherit; font-size: 12px; text-transform: uppercase; box-sizing: border-box; }
        
        .promo-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-apply { background: #000; color: #fff; border: none; padding: 0 25px; font-weight: 900; cursor: pointer; }

        /* REGLA DE ANIMACIÓN CORREGIDA */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #discount-msg { color: var(--accent); font-weight: 900; font-size: 11px; margin-top: 5px; animation: blink 1s infinite; display: none; }

        .summary-box { background: #000; color: #fff; padding: 45px 20px; text-align: center; }
        .total-amount { font-family: 'Inter'; font-weight: 900; font-size: 42px; color: #fff; margin: 15px 0; letter-spacing: -2px; }
        .btn-checkout { background: var(--accent); color: #000; padding: 22px; font-family: 'Inter'; font-weight: 900; font-size: 16px; width: 100%; border: none; cursor: pointer; }

        #console-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: var(--neon); padding: 40px; box-sizing: border-box; }

        @media (max-width: 600px) {
            .main-header { padding: 15px 20px; }
            .biomass-dashboard { grid-template-columns: 1fr; }
            .cart-row td { padding: 12px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><img src="img/logo-preps.png" alt="PREPS"></a>
        <nav class="main-nav">
            <a href="index.html">HOME</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
        </nav>
    </header>

    <div class="container" id="main-container">
        <div id="cart-content"></div>
    </div>

    <div id="console-modal">
        <div id="console-text" style="font-family: monospace; line-height: 1.8;"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
        let discount = 0;
        
        const macroDB = {
            "HIGH CARB": {k: 830, p: 73, c: 92},
            "LOW CARB": {k: 632, p: 69, c: 49},
            "PACK 5": {k: 3600, p: 350, c: 300},
            "PACK 15": {k: 10800, p: 1050, c: 900},
            "PACK 28": {k: 20000, p: 2000, c: 1700}
        };

        function renderCart() {
            const container = document.getElementById('cart-content');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <p style="font-size:12px; letter-spacing:4px; opacity:0.5;">SISTEMA EN ESPERA...</p>
                        <h1 class="cart-title">INVENTARIO VACÍO</h1>
                        <br><br>
                        <a href="catalogo.html" style="background:#000; color:#fff; padding:20px 40px; text-decoration:none; font-weight:900; display:inline-block;">INICIAR CARGA</a>
                    </div>`;
                return;
            }

            const grouped = cart.reduce((acc, item) => {
                acc[item.name] = acc[item.name] || { count: 0, price: item.price };
                acc[item.name].count++;
                return acc;
            }, {});

            let totalMoney = 0, totalKcal = 0, totalProt = 0, totalCarb = 0;
            let tableRows = "";

            for (const [name, data] of Object.entries(grouped)) {
                totalMoney += data.price * data.count;
                let key = Object.keys(macroDB).find(k => name.toUpperCase().includes(k));
                if(key) {
                    totalKcal += macroDB[key].k * data.count;
                    totalProt += macroDB[key].p * data.count;
                    totalCarb += macroDB[key].c * data.count;
                } else if (name.includes("CUSTOM")) {
                    totalKcal += 750 * data.count; totalProt += 70 * data.count;
                }

                tableRows += `
                    <tr class="cart-row">
                        <td><span style="font-weight:900;">${name}</span></td>
                        <td width="120">
                            <div class="qty-controls">
                                <button class="btn-qty" onclick="changeQty('${name}', -1)">-</button>
                                <span style="font-weight:900;">${data.count}</span>
                                <button class="btn-qty" onclick="changeQty('${name}', 1)">+</button>
                            </div>
                        </td>
                        <td style="text-align:right; font-weight:900;">$${(data.price * data.count).toLocaleString('es-CL')}</td>
                    </tr>`;
            }

            container.innerHTML = `
                <div class="cart-title">ESTADO DE CARGA NUTRICIONAL</div>
                <div class="progress-label" style="margin-top:20px; font-size:9px; letter-spacing:1px; font-weight:900;">
                    <span>VOLUMEN SEMANAL</span> 
                    <span id="status-tag">CALCULANDO...</span>
                </div>
                <div class="progress-container"><div id="progress-bar"></div></div>

                <div class="biomass-dashboard">
                    <div class="macro-card"><span class="macro-label">TOTAL KCAL</span><span class="macro-total-val">${Math.round(totalKcal).toLocaleString()}</span></div>
                    <div class="macro-card"><span class="macro-label">TOTAL PROT</span><span class="macro-total-val">${Math.round(totalProt)}G</span></div>
                    <div class="macro-card"><span class="macro-label">TOTAL CARB</span><span class="macro-total-val">${Math.round(totalCarb)}G</span></div>
                </div>

                <table class="cart-table">${tableRows}</table>

                <div class="form-box">
                    <span class="form-label">[DATOS DE CONTACTO]</span>
                    <input type="text" id="cust-name" placeholder="NOMBRE COMPLETO">
                    <input type="email" id="cust-email" placeholder="CORREO ELECTRÓNICO">
                    
                    <span class="form-label">[LOGÍSTICA]</span>
                    <select id="delivery-method" onchange="toggleDelivery()">
                        <option value="RETIRO">RETIRO LOCAL (SANTIAGO)</option>
                        <option value="DELIVERY">DELIVERY ZONAL (SANTIAGO)</option>
                    </select>
                    <div id="delivery-options" style="display:none; margin-top:15px;">
                        <select id="comuna">
                            <option value="VITACURA">VITACURA</option>
                            <option value="LAS CONDES">LAS CONDES</option>
                            <option value="PROVIDENCIA">PROVIDENCIA</option>
                            <option value="LO BARNECHEA">LO BARNECHEA</option>
                            <option value="METRO">METRO A CONVENIR</option>
                        </select>
                    </div>
                </div>

                <div class="form-box">
                    <span class="form-label">[CÓDIGO DE ACCESO]</span>
                    <div class="promo-group">
                        <input type="text" id="promo-code" placeholder="INGRESAR CÓDIGO" style="margin-bottom:0;">
                        <button class="btn-apply" onclick="applyPromo()">OK</button>
                    </div>
                    <div id="discount-msg" style="${discount > 0 ? 'display:block' : 'none'}">>> CÓDIGO ACTIVADO: -10% DE DESCUENTO</div>
                </div>

                <div class="summary-box">
                    <span style="font-size: 10px; letter-spacing: 4px; opacity: 0.5;">MONTO TOTAL NETO</span>
                    <div class="total-amount" id="display-total">$${Math.round(totalMoney * (1-discount)).toLocaleString('es-CL')}</div>
                    <button class="btn-checkout" onclick="startConsole()">FINALIZAR PROTOCOLO (WSP)</button>
                </div>
            `;

            setTimeout(() => {
                const bar = document.getElementById('progress-bar');
                const tag = document.getElementById('status-tag');
                let pct = Math.min((cart.length / 12) * 100, 100);
                bar.style.width = pct + "%";
                if(pct < 40) { bar.style.background = "#ff4444"; tag.innerText = "BAJA"; }
                else if(pct < 80) { bar.style.background = "#ffcc00"; tag.innerText = "MEDIA"; }
                else { bar.style.background = "#39FF14"; tag.innerText = "ÓPTIMA"; }
            }, 100);
        }

        function toggleDelivery() {
            const options = document.getElementById('delivery-options');
            if(options) options.style.display = (document.getElementById('delivery-method').value === 'DELIVERY') ? 'block' : 'none';
        }

        function applyPromo() {
            const code = document.getElementById('promo-code').value.toUpperCase();
            if (code === 'MILA10') {
                discount = 0.10;
                renderCart();
            } else { alert("SISTEMA: CÓDIGO INVÁLIDO"); }
        }

        function changeQty(name, delta) {
            if(delta > 0) {
                const item = cart.find(i => i.name === name);
                cart.push({...item});
            } else {
                const index = cart.findIndex(i => i.name === name);
                cart.splice(index, 1);
            }
            localStorage.setItem('preps_cart', JSON.stringify(cart));
            renderCart();
        }

        function startConsole() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            if(!name || !email) { alert("DATOS DE CONTACTO INCOMPLETOS"); return; }
            
            const modal = document.getElementById('console-modal');
            const text = document.getElementById('console-text');
            modal.style.display = 'flex';
            text.innerHTML = "";
            const lines = ["> CONEXIÓN ESTABLECIDA...", "> VALIDANDO BIOMASA...", "> GENERANDO TICKET #"+Math.floor(Math.random()*9000+1000), "> ACCESO CONCEDIDO..."];
            let i = 0;
            const intv = setInterval(() => {
                text.innerHTML += lines[i] + "<br>"; i++;
                if(i >= lines.length) { clearInterval(intv); setTimeout(sendToWhatsApp, 600); }
            }, 400);
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const method = document.getElementById('delivery-method').value;
            const comuna = (method === 'DELIVERY') ? document.getElementById('comuna').value : 'RETIRO';
            const totalVal = document.getElementById('display-total').innerText;

            let msg = `🧪 *ORDEN DE CARGA PREPS*%0A👤 *CLIENTE:* ${name.toUpperCase()}%0A📧 *EMAIL:* ${email.toUpperCase()}%0A📍 *LOG:* ${method} (${comuna})%0A%0A`;
            
            const grouped = cart.reduce((acc, item) => { acc[item.name] = (acc[item.name] || 0) + 1; return acc; }, {});
            for (const [n, c] of Object.entries(grouped)) { msg += `• ${c}x ${n}%0A`; }
            
            if(discount > 0) msg += `%0A🎟️ *CÓDIGO MILA10 APLICADO (-10%)*`;
            msg += `%0A💰 *TOTAL:* ${totalVal}`;
            window.location.href = `https://wa.me/56941892028?text=${msg}`;
        }

        window.addEventListener('load', renderCart);
    </script>
</body>
</html>
