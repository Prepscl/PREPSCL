<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>SISTEMA DE CARGA - PREPS</title>
    <link rel="icon" type="image/png" href="img/logo-preps.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --accent: #25D366; --dark: #000; --light: #f2f2f2; --neon: #39FF14; }
        body { background-color: var(--light); color: var(--dark); font-family: 'Courier New', monospace; margin: 0; text-transform: uppercase; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 50px; background: #f2f2f2; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-link img { height: 35px; width: auto; display: block; }
        .main-nav { display: flex; align-items: center; gap: 30px; }
        .main-nav a { text-decoration: none; color: #000; font-size: 13px; letter-spacing: 2px; }
        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        .biomass-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 25px 0; }
        .macro-card { background: linear-gradient(145deg, #111, #000); color: #fff; padding: 20px 10px; text-align: center; border: 1px solid #333; border-radius: 4px; box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.05); position: relative; overflow: hidden; }
        .macro-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); opacity: 0.3; }
        .macro-label { font-size: 8px; opacity: 0.5; display: block; margin-bottom: 8px; letter-spacing: 2px; }
        .macro-total-val { font-family: 'Inter'; font-weight: 900; font-size: 22px; color: var(--neon); text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }
        .progress-container { background: #ddd; height: 6px; width: 100%; margin: 10px 0 30px; border-radius: 10px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; transition: 1.5s ease; background: #ff4444; }
        .cart-title { font-family: 'Inter'; font-weight: 900; font-size: 24px; letter-spacing: -1px; margin-top: 40px; text-align: center; }
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border: 1px solid #000; }
        .cart-row td { padding: 18px; border-bottom: 1px solid #eee; font-size: 11px; }
        .qty-controls { display: flex; align-items: center; gap: 12px; justify-content: center; background: #f9f9f9; padding: 5px; border-radius: 4px; }
        .btn-qty { background: #000; color: #fff; border: none; width: 28px; height: 28px; cursor: pointer; font-weight: 900; transition: 0.2s; }
        .form-box { background:#fff; border:1px solid #000; padding:30px; margin-bottom:20px; text-align:left; }
        .form-label { font-weight:900; font-size:10px; display:block; margin-bottom:20px; opacity:0.5; letter-spacing:1px; }
        input, select { width:100%; padding:15px; margin-bottom:15px; border:1px solid #eee; font-family:inherit; font-size: 12px; text-transform: uppercase; box-sizing: border-box; }
        .promo-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-apply { background: #000; color: #fff; border: none; padding: 0 25px; font-weight: 900; cursor: pointer; }
        #discount-msg { color: var(--accent); font-weight: 900; font-size: 11px; margin-top: 5px; animation: blink 1s infinite; display: none; }
        .summary-box { background: #000; color: #fff; padding: 45px 20px; text-align: center; }
        .total-amount { font-family: 'Inter'; font-weight: 900; font-size: 42px; color: #fff; margin: 15px 0; letter-spacing: -2px; }
        .btn-checkout { background: var(--accent); color: #000; padding: 22px; font-family: 'Inter'; font-weight: 900; font-size: 16px; width: 100%; border: none; cursor: pointer; transition: 0.3s; }
        #console-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: var(--neon); padding: 40px; box-sizing: border-box; }
        #console-text { font-family: 'Courier New', monospace; font-size: 14px; text-align: left; max-width: 400px; margin-bottom: 30px; }
        .btn-download-final { background: var(--neon); color: #000; padding: 22px 35px; border: none; font-weight: 900; font-family: 'Inter'; cursor: pointer; margin-bottom: 20px; font-size: 18px; transition: 0.3s; }
        .btn-wsp-final { background: transparent; color: var(--neon); padding: 18px 30px; border: 2px solid var(--neon); font-weight: 900; font-family: 'Inter'; cursor: pointer; display: none; text-decoration: none; font-size: 14px; }
        #ticket-preview-container { display: none; width: 100%; max-width: 300px; margin-top: 20px; border: 2px solid var(--neon); }
        #ticket-preview-img { width: 100%; height: auto; display: block; }
        #ticket-export { position: absolute; left: -9999px; top: 0; width: 600px; background: #fff; color: #000; padding: 50px; box-sizing: border-box; border: 1px solid #000; }
        .tk-header { border-bottom: 5px solid #000; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .tk-logo { height: 60px; }
        .tk-factura-label { font-family: 'Inter'; font-weight: 900; font-size: 40px; }
        .tk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; font-size: 12px; }
        .tk-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        .tk-table thead { background: #000; color: #fff; }
        .tk-table td { padding: 15px; border: 1px solid #eee; }
        .tk-total-section { margin-left: auto; width: 250px; }
        .tk-total-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-weight: 900; }
        @media (max-width: 600px) { .main-header { padding: 15px 20px; } .biomass-dashboard { grid-template-columns: 1fr; } .cart-row td { padding: 12px; font-size: 10px; } }
    </style>
</head>
<body>
    <header class="main-header"><a href="index.html" class="logo-link"><img src="img/logo-preps.png"></a>
        <nav class="main-nav"><a href="index.html">HOME</a><a href="catalogo.html">CATÁLOGO</a><a href="nosotros.html">NOSOTROS</a></nav>
    </header>
    <div class="container" id="main-container"><div id="cart-content"></div></div>
    <div id="console-modal">
        <form id="form-produccion" action="https://formspree.io/f/mbdpnlqr" method="POST" target="v_iframe" onsubmit="generateTicketNow()">
            <input type="hidden" name="CLIENTE" id="f-cliente">
            <input type="hidden" name="email" id="f-email">
            <input type="hidden" name="ENTREGA" id="f-entrega">
            <input type="hidden" name="TOTAL" id="f-total">
            <textarea name="DETALLE_COCINA" id="f-cocina" style="display:none"></textarea>
            <button type="submit" id="btn-trigger-download" class="btn-download-final">GENERAR TICKET DE CARGA</button>
        </form>
        <iframe name="v_iframe" id="v_iframe" style="display:none;"></iframe>
        <div id="console-text"></div>
        <div id="ticket-preview-container"><img id="ticket-preview-img" src=""><p style="font-size: 9px; color: var(--neon); margin-top: 10px; text-align: center;">MANTÉN PRESIONADA LA IMAGEN PARA GUARDARLA</p></div>
        <button id="btn-goto-wsp" class="btn-wsp-final" onclick="sendToWhatsApp()">CONTINUAR A WHATSAPP</button>
    </div>
    <div id="ticket-export">
        <div class="tk-header"><img src="img/logo-preps.png" class="tk-logo"><div class="tk-factura-label">ORDEN DE CARGA</div></div>
        <div class="tk-grid"><div><strong>PREPS LABS</strong><br>SANTIAGO, CHILE</div><div align="right"><strong>DESTINATARIO:</strong><br><span id="tk-name-val"></span><br><span id="tk-email-val"></span></div></div>
        <div class="tk-grid"><div><strong>TICKET ID:</strong> <span id="tk-id-val"></span></div><div align="right"><strong>FECHA:</strong> <span id="tk-date-val"></span></div></div>
        <table class="tk-table"><thead><tr><td>PRODUCTO</td><td align="center">QTY</td><td align="right">TOTAL</td></tr></thead><tbody id="tk-body-items"></tbody></table>
        <div class="tk-total-section"><div class="tk-total-row"><span>SUBTOTAL</span> <span id="tk-sub-val"></span></div><div class="tk-total-row" id="tk-dscto-row" style="display:none; color: green;"><span>DSCTO (10%)</span> <span id="tk-dscto-val"></span></div><div class="tk-total-row" style="background: #000; color: #fff; padding: 15px 10px; margin-top: 10px;"><span>TOTAL</span> <span id="tk-total-val"></span></div></div>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('preps_cart')) || [];
        let discount = 0;
        const macroDB = { "HIGH CARB": {k: 830, p: 73, c: 90}, "LOW CARB": {k: 632, p: 69, c: 49} };

        function renderCart(sName = "", sEmail = "") {
            const container = document.getElementById('cart-content');
            if (cart.length === 0) { container.innerHTML = `<div style="text-align:center; padding:100px 20px;"><h1 class="cart-title">INVENTARIO VACÍO</h1><br><a href="catalogo.html" style="background:#000; color:#fff; padding:20px 40px; text-decoration:none; font-weight:900;">INICIAR CARGA</a></div>`; return; }
            const grouped = cart.reduce((acc, item) => { acc[item.name] = acc[item.name] || { count: 0, price: item.price }; acc[item.name].count++; return acc; }, {});
            let tMoney = 0, tKcal = 0, tProt = 0, tCarb = 0, tableRows = "";
            for (const [name, data] of Object.entries(grouped)) {
                tMoney += data.price * data.count;
                if (name.includes("MACROS:")) {
                    const mP = name.match(/(\d+)P/); const mC = name.match(/\|(\d+)C/); const mK = name.match(/(\d+)KCAL/);
                    tProt += (mP ? parseInt(mP[1]) : 0) * data.count; tCarb += (mC ? parseInt(mC[1]) : 0) * data.count; tKcal += (mK ? parseInt(mK[1]) : 0) * data.count;
                } else {
                    let key = Object.keys(macroDB).find(k => name.toUpperCase().includes(k));
                    if(key) { tKcal += macroDB[key].k * data.count; tProt += macroDB[key].p * data.count; tCarb += macroDB[key].c * data.count; }
                }
                let label = name.includes("CUSTOM:") ? name.split(" | ")[1] + " [" + name.split(" | ")[0].replace("CUSTOM: ","") + "]" : name;
                tableRows += `<tr class="cart-row"><td><span style="font-weight:900;">${label}</span></td><td width="120"><div class="qty-controls"><button class="btn-qty" onclick="changeQty('${name}', -1)">-</button><span style="font-weight:900;">${data.count}</span><button class="btn-qty" onclick="changeQty('${name}', 1)">+</button></div></td><td style="text-align:right; font-weight:900;">$${(data.price * data.count).toLocaleString('es-CL')}</td></tr>`;
            }
            container.innerHTML = `<div class="cart-title">ESTADO DE CARGA</div><div class="progress-container"><div id="progress-bar"></div></div><div class="biomass-dashboard"><div class="macro-card"><span class="macro-label">KCAL</span><span class="macro-total-val">${Math.round(tKcal)}</span></div><div class="macro-card"><span class="macro-label">PROT</span><span class="macro-total-val">${Math.round(tProt)}G</span></div><div class="macro-card"><span class="macro-label">CARB</span><span class="macro-total-val">${Math.round(tCarb)}G</span></div></div><table class="cart-table">${tableRows}</table><div class="form-box"><span class="form-label">[CONTACTO]</span><input type="text" id="cust-name" placeholder="NOMBRE" value="${sName}"><input type="email" id="cust-email" placeholder="EMAIL" value="${sEmail}"><select id="delivery-method" onchange="toggleDelivery()"><option value="RETIRO">RETIRO</option><option value="DELIVERY">DELIVERY</option></select></div><div class="form-box"><label style="display:flex; gap:10px; font-size:11px;"><input type="checkbox" id="protocol-check" onchange="toggleCheckoutBtn()"> ACEPTO PROTOCOLO</label></div><div class="summary-box"><div class="total-amount" id="display-total">$${Math.round(tMoney * (1-discount)).toLocaleString('es-CL')}</div><button class="btn-checkout" id="final-checkout-btn" onclick="startProcess()" disabled>ACEPTAR PROTOCOLO</button></div>`;
            setTimeout(() => { document.getElementById('progress-bar').style.width = Math.min((cart.length / 12) * 100, 100) + "%"; }, 100);
        }

        function toggleCheckoutBtn() { const check = document.getElementById('protocol-check').checked; const btn = document.getElementById('final-checkout-btn'); btn.disabled = !check; btn.style.background = check ? "var(--accent)" : "#ccc"; btn.innerText = check ? "GENERAR TICKET" : "ACEPTAR PROTOCOLO"; }
        function toggleDelivery() { } 
        function changeQty(n, d) { d > 0 ? cart.push({...cart.find(i => i.name === n)}) : cart.splice(cart.findIndex(i => i.name === n), 1); localStorage.setItem('preps_cart', JSON.stringify(cart)); renderCart(document.getElementById('cust-name').value, document.getElementById('cust-email').value); }

        function startProcess() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            if(!name || !email) { alert("DATOS INCOMPLETOS"); return; }
            
            // Llenar campos de Formspree antes de mostrar el modal
            document.getElementById('f-cliente').value = name.toUpperCase();
            document.getElementById('f-email').value = email;
            document.getElementById('f-entrega').value = document.getElementById('delivery-method').value;
            document.getElementById('f-total').value = document.getElementById('display-total').innerText;
            
            let cocina = "";
            const grouped = cart.reduce((acc, item) => { acc[item.name] = acc[item.name] || { count: 0 }; acc[item.name].count++; return acc; }, {});
            for (const [n, d] of Object.entries(grouped)) { 
                if(n.includes("CUSTOM:")) {
                    const p = n.split(" | "); cocina += `PERSONALIZADO (x${d.count})\n- ${p[1]}\n- ETIQUETA: ${p[0].replace("CUSTOM: ","")}\n- RECETA: ${p[3]}\n- SAZON: ${p[4]}\n\n`;
                } else { cocina += `${n} (x${d.count})\n`; }
            }
            document.getElementById('f-cocina').value = cocina;
            document.getElementById('console-modal').style.display = 'flex';
        }

        function generateTicketNow() {
            const text = document.getElementById('console-text');
            text.innerHTML = "> INICIANDO PROTOCOLO PREPS...<br>> COMANDA ENVIADA AL LABORATORIO.<br>> GENERANDO TICKET...";
            document.getElementById('btn-trigger-download').style.display = 'none';
            
            const ticket = document.getElementById('ticket-export');
            const subtotal = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('tk-name-val').innerText = document.getElementById('f-cliente').value;
            document.getElementById('tk-email-val').innerText = document.getElementById('f-email').value;
            document.getElementById('tk-id-val').innerText = "#PRP-" + Math.floor(Math.random()*9000+1000);
            document.getElementById('tk-date-val').innerText = new Date().toLocaleDateString();
            document.getElementById('tk-sub-val').innerText = "$" + subtotal.toLocaleString('es-CL');
            document.getElementById('tk-total-val').innerText = document.getElementById('f-total').value;
            
            const body = document.getElementById('tk-body-items'); body.innerHTML = "";
            const grouped = cart.reduce((acc, item) => { acc[item.name] = acc[item.name] || { count: 0, price: item.price }; acc[item.name].count++; return acc; }, {});
            for (const [n, data] of Object.entries(grouped)) {
                let clean = n.includes("CUSTOM:") ? n.split(" | ")[1] + " [" + n.split(" | ")[0].replace("CUSTOM: ","") + "]" : n;
                body.innerHTML += `<tr><td>${clean}</td><td align="center">${data.count}</td><td align="right">$${(data.price * data.count).toLocaleString('es-CL')}</td></tr>`;
            }

            html2canvas(ticket, { scale: 2 }).then(canvas => {
                const dataUrl = canvas.toDataURL("image/png");
                document.getElementById('ticket-preview-img').src = dataUrl;
                document.getElementById('ticket-preview-container').style.display = 'block';
                const link = document.createElement('a'); link.download = `PREPS-TICKET.png`; link.href = dataUrl; link.click();
                document.getElementById('btn-goto-wsp').style.display = 'block';
            });
        }

        function sendToWhatsApp() {
            localStorage.removeItem('preps_cart');
            window.location.href = `https://wa.me/56941892028?text=HOLA PREPS, ADJUNTO MI TICKET DE CARGA.`;
        }
        window.addEventListener('load', () => renderCart("", ""));
    </script>
</body>
</html>
