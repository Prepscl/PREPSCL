<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>PREPS — Diseñado para tu rendimiento</title>
  <meta name="description" content="PREPS. Alimentación diseñada para tu rendimiento.">
  <link rel="icon" type="image/png" href="img/logo-preps.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #f6f6f2;
      --muted: rgba(246, 246, 242, .58);
      --line: rgba(255, 255, 255, .22);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: #030303;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 640px;
      isolation: isolate;
      overflow: hidden;
      background: #030303;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.035);
      animation: heroIn 1.8s var(--ease) forwards;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(0,0,0,.64) 0%, rgba(0,0,0,.24) 38%, transparent 65%),
        linear-gradient(180deg, rgba(0,0,0,.34), transparent 32%, rgba(0,0,0,.2));
      pointer-events: none;
    }
    .rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 168px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      padding: 34px 25px 30px;
      border-right: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(0,0,0,.2), transparent);
      animation: railIn 1.1s var(--ease) both;
    }
    .brand {
      position: relative;
      display: block;
      width: 92px;
      aspect-ratio: 708 / 174;
      overflow: hidden;
      line-height: 0;
    }
    .brand img {
      position: absolute;
      top: -244.25%;
      left: -22.6%;
      display: block;
      width: 144.63%;
      max-width: none;
      height: auto;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 17px;
      margin: auto 0;
    }
    .nav a {
      position: relative;
      width: max-content;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      transition: color 180ms ease, transform 260ms var(--ease);
    }
    .nav a::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -25px;
      width: 0;
      height: 1px;
      background: var(--white);
      transition: width 260ms var(--ease);
    }
    .nav a:hover, .nav a.active { color: var(--white); transform: translateX(8px); }
    .nav a:hover::before, .nav a.active::before { width: 18px; }
    .cart-link { display: inline-flex !important; align-items: center; gap: 7px; }
    .cart-link svg { width: 14px; height: 14px; }
    #global-cart-count {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 20px;
      background: var(--white);
      color: #050505;
      font-size: 8px;
      letter-spacing: 0;
    }
    .rail-bottom {
      color: rgba(255,255,255,.38);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: .13em;
      line-height: 1.6;
      text-transform: uppercase;
    }
    .hero-copy {
      position: absolute;
      left: clamp(212px, 15vw, 286px);
      bottom: clamp(58px, 10vh, 116px);
      z-index: 3;
      width: min(530px, calc(100vw - 220px));
      animation: copyIn 1.25s .25s var(--ease) both;
    }
    h1 {
      position: relative;
      max-width: 520px;
      margin: 0;
      font-size: clamp(48px, 5.2vw, 88px);
      font-weight: 800;
      letter-spacing: -.065em;
      line-height: .88;
      text-transform: uppercase;
      text-wrap: balance;
      color: #555a5d;
      background: linear-gradient(180deg, #747a7d 0%, #484d50 34%, #2e3235 58%, #5d6265 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: .5px rgba(190, 197, 201, .26);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.94)) drop-shadow(0 0 10px rgba(173,181,185,.07));
    }
    .hero-action {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-top: 30px;
      color: var(--white);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .hero-action span {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 50%;
      transition: background 220ms ease, color 220ms ease, transform 260ms var(--ease);
    }
    .hero-action:hover span { background: var(--white); color: #050505; transform: translateX(4px); }
    @keyframes heroIn {
      from { opacity: 0; transform: scale(1.12); filter: blur(10px); }
      to { opacity: 1; transform: scale(1.035); filter: blur(0); }
    }
    @keyframes railIn { from { opacity: 0; transform: translateX(-24px); } }
    @keyframes copyIn { from { opacity: 0; transform: translateY(32px); } }
    @media (max-width: 520px) {
      .hero { min-height: 620px; }
      .hero-bg { object-position: 67% center; transform: scale(1.04); }
      .hero::before {
        background:
          linear-gradient(180deg, rgba(0,0,0,.52), transparent 36%),
          linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.36) 48%, transparent 70%);
      }
      .rail {
        inset: 0 0 auto 0;
        width: 100%;
        height: 86px;
        flex-direction: row;
        align-items: center;
        padding: 20px 18px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        background: rgba(0,0,0,.3);
        backdrop-filter: blur(12px);
      }
      .brand { width: 74px; }
      .nav { flex-direction: row; gap: 15px; margin: 0 0 0 auto; }
      .nav a { font-size: 8px; letter-spacing: .1em; }
      .nav a::before, .nav a.active::before { display: none; }
      .nav a:hover, .nav a.active { transform: none; }
      .nav a:nth-child(3), .nav a:nth-child(4) { display: none; }
      .rail-bottom { display: none; }
      .hero-copy { left: 22px; right: 22px; bottom: 46px; width: auto; }
      h1 { max-width: 340px; font-size: clamp(44px, 14vw, 64px); }
      .hero-action { margin-top: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="hero-bg" src="img/hero-preps-menu2-v3.png" alt="PREPS de pollo, arroz y brócoli">
    <header class="rail">
      <a class="brand" href="index.html" aria-label="PREPS Home">
        <img src="img/logo-preps.png" alt="PREPS">
      </a>
      <nav class="nav" aria-label="Navegación principal">
        <a class="active" href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="personalizar.html">Custom Lab</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="carrito.html" class="cart-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
          </svg>
          Carrito <span id="global-cart-count">0</span>
        </a>
      </nav>
      <div class="rail-bottom">Santiago, Chile<br>PREPS © 2026</div>
    </header>
    <section class="hero-copy" aria-labelledby="hero-title">
      <h1 id="hero-title" data-text="Diseñado para tu rendimiento">Diseñado para tu rendimiento</h1>
      <a class="hero-action" href="catalogo.html">Explorar catálogo <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <script>
    const cart = JSON.parse(localStorage.getItem('preps_cart') || '[]');
    const count = document.getElementById('global-cart-count');
    if (count && cart.length) {
      count.textContent = cart.length;
      count.style.display = 'inline-flex';
    }
  </script>
  <script src="chatbot.js" defer></script>
</body>
</html>
